name: Licenses

# Keep THIRD-PARTY-NOTICES.md in sync with the module graph. Runs only when the
# dependency set or the generator/notices file changes, so it does not slow down
# the common PR. Regenerates the notices file with the same script contributors
# use and fails if the committed copy is stale.
on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - THIRD-PARTY-NOTICES.md
      - scripts/gen-notices.sh
      - .github/workflows/licenses.yml
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - THIRD-PARTY-NOTICES.md
      - scripts/gen-notices.sh
      - .github/workflows/licenses.yml

permissions:
  contents: read

jobs:
  notices:
    name: Third-party notices up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: regenerate notices
        run: ./scripts/gen-notices.sh
      - name: fail if stale
        run: |
          if ! git diff --exit-code THIRD-PARTY-NOTICES.md; then
            echo "::error::THIRD-PARTY-NOTICES.md is out of date. Run scripts/gen-notices.sh and commit the result."
            exit 1
          fi
