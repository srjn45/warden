name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: openapi codegen up to date
        # openapi.yaml is the single source of truth for the daemon's HTTP API;
        # internal/daemon/oapi/api.gen.go is generated from it and committed. Fail
        # if the spec changed without regenerating (or the generated file was
        # hand-edited) so the two can never silently drift.
        run: make generate-check

  gendocs:
    name: CLI reference up to date
    # site/src/content/docs/reference/cli.md is generated from the cobra command
    # tree (cmd/gendocs). Regenerate and fail if the committed page is stale —
    # i.e. a command's Use/Short/Long or flags changed without `make gendocs`.
    # Runs unfiltered because any internal/cli change can move the help output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: cli reference codegen up to date
        run: make gendocs-check

  test-go:
    name: Test (Go)
    # Runs on the cheaper/faster ubuntu runner. GOOS-specific code paths are
    # covered by per-GOOS test branches rather than a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...

  test-web:
    name: Test (web)
    # Pure Node, so it runs on the ubuntu runner in parallel with the Go tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web unit tests
        run: cd web && npm ci && npm test

  upgrade-fixtures:
    name: Upgrade fixtures & rollback gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run upgrade fixture integration tests
        run: go test -v ./internal/updater -run 'TestUpgradeFixtures|TestMultiHopUpgrade|TestTxnFault'

  build:
    name: Release build
    needs: [lint, test-go, test-web, upgrade-fixtures]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI + binary (make release)
        run: make release
      - name: Smoke-test the binary
        run: ./bin/warden --help
