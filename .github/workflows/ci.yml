name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: openapi codegen up to date
        # openapi.yaml is the single source of truth for the daemon's HTTP API;
        # internal/daemon/oapi/api.gen.go is generated from it and committed. Fail
        # if the spec changed without regenerating (or the generated file was
        # hand-edited) so the two can never silently drift.
        run: make generate-check

  gendocs:
    name: CLI reference up to date
    # site/src/content/docs/reference/cli.md is generated from the cobra command
    # tree (cmd/gendocs). Regenerate and fail if the committed page is stale —
    # i.e. a command's Use/Short/Long or flags changed without `make gendocs`.
    # Runs unfiltered because any internal/cli change can move the help output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: cli reference codegen up to date
        run: make gendocs-check

  test-go:
    name: Test (Go)
    # Runs on macOS to match the development platform (tmux-driven sessions,
    # macOS pressure sampler). The binary itself cross-compiles to Linux — see
    # the build matrix below.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: brew install tmux
      - name: Go tests
        run: go test ./...

  test-web:
    name: Test (web)
    # Pure Node — no tmux or macOS sampler, so it runs on the faster/cheaper
    # ubuntu runner, in parallel with the Go tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web unit tests
        run: cd web && npm ci && npm test

  build:
    name: Release build (${{ matrix.os }})
    needs: [lint, test-go, test-web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI + binary (make release)
        run: make release
      - name: Smoke-test the binary
        run: ./bin/warden --help

  # Runtime smoke test on non-Ubuntu Linux distros. .goreleaser.yaml ships
  # deb/rpm/arch packages, but nothing else in CI verifies the binary actually
  # runs on a Fedora/Arch userspace — a distro-specific runtime regression
  # (missing shared lib, an accidental CGO dependency, a path assumption) would
  # otherwise only surface after release. We build the binary the same way the
  # release does (CGO_ENABLED=0 static) on the ubuntu runner, then execute it
  # inside each distro's container image and assert `--help` exits 0.
  distro-smoke:
    name: Distro smoke (${{ matrix.image }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [fedora:latest, archlinux:latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build linux binary (static, like the release)
        run: CGO_ENABLED=0 GOOS=linux go build -buildvcs=false -o warden ./cmd/warden
      - name: Run --help inside ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/warden:/usr/local/bin/warden:ro" "${{ matrix.image }}" \
            sh -c 'set -e; warden --help; warden daemon --help; echo "smoke OK on $(cat /etc/os-release | grep ^PRETTY_NAME=)"'
