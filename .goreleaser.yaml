# goreleaser configuration for warden.
# Docs: https://goreleaser.com  —  run `goreleaser check` to validate.
version: 2

project_name: warden

before:
  hooks:
    # Build the web UI first so go:embed bakes the real dashboard into the
    # binary (the Go build embeds web/dist).
    - sh -c "cd web && npm ci && npm run build"
    # Generate release manifest.json published and checksummed with the archives.
    # Schema 3 was compatibility-tested against the released v12.1.0 updater.
    # Keep this envelope explicit: the generator validates it before publishing.
    - >-
      go run ./cmd/genmanifest -version '{{ .Version }}'
      -schema-version 3 -min-schema 2 -min-upgrade-from 12.1.0 -breaking
      -requires-capabilities stopped-daemon=1,schema3-transaction-handoff=1,verified-paired-backup=1,generation-restore=1
      -notes 'schema 3 ownership normalization,paired-data rollback'
      -out ./manifest.json

builds:
  - id: warden
    main: ./cmd/warden
    binary: warden
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/srjn45/warden/internal/cli.version={{ .Version }}
      - -X github.com/srjn45/warden/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/srjn45/warden/internal/cli.date={{ .Date }}

archives:
  - id: warden
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - THIRD-PARTY-NOTICES.md

# Official distribution is curl-piped install.sh + `warden update`. OS package
# managers (deb/rpm/AUR/Homebrew) are no longer published from this config.

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge branch"
      - "Merge pull request"

release:
  github:
    owner: srjn45
    name: warden
  draft: false
  prerelease: auto
  name_template: "warden {{ .Tag }}"
  # Attach the standalone installer so GitHub Releases ship install.sh next to
  # the cross-compiled archives and checksums.txt.
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./manifest.json
  # keep-existing lets a re-run for the same tag skip assets that already
  # uploaded successfully instead of failing with 422 already_exists.
  mode: keep-existing
