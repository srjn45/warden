  - "limitClearsAt() uses backend's RateLimitResetParser when present; falls back to legacy Claude parsers."
  - "OpenCode, Crush, Goose sessions transition to StatusRateLimited via the 60s usage-API polling fallback."
  - "Tea TUI backends (OpenCode/Crush/Goose) are skipped by pane-based path to avoid double-trigger."
  - "BackendRecoveryCoordinator.OnHardLimit fires for ALL agents (handover-settings gate removed)."
  - "When all candidates are exhausted, waitLocked schedules retry at earliest ResetsAt across all backends."
  - "Conformance tests cover RateLimitDetector for all 8 backends (pane-based or noted as pane-blind)."
