  - "wd plan scan infers status from directory placement; idempotent; never overwrites execution links."
  - "plans ScrivaDB collection exists with full CRUD; stable ID derived from project + plan name."
  - "GET /api/v1/projects/{id}/plans returns plans; POST /scan upserts; POST /assess triggers brain."
  - "wd plan status performs git mv + commit + DB update atomically."
  - "wd plan list/show/import/scan/status/archive/assess all work end-to-end."
  - "MCP tools list_plans, get_plan, create_plan, scan_plans, update_plan_status, archive_plan, assess_plan available."
  - "TUI project tree shows Plans above Agents, grouped by status, with detail pane and assess keybinding."
  - "wd plan run --mode autopilot|pipeline|orchestrator_worker|manual links plan to execution entity and git-mvs to in_progress/."
  - "Completion events auto-advance plan to completed/ (git mv + commit + DB update)."
  - "wd plan assess uses internal/brainconsult to reconstruct task_progress from git log and open PRs."
  - "make verify-fast passes on main after each phase."
  - "Docs updated: README, FEATURES.md, USAGE.md, site guides/concepts, skills."
