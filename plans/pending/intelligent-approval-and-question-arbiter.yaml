version: 1
name: intelligent-approval-and-question-arbiter
goal: >-
  Implement the universal Fast-Brain Gateway port (Engine.Decide) in internal/fastbrain
  to power all non-deterministic micro-decisions, and implement the Intelligent Auto-Approval &
  Question Arbiter across all supported agent backends (Claude, Codex, Cursor, Antigravity)
  with zero-downtime human fallback.
constraints:
  - "Work in an isolated branch/worktree off origin/main; one worker per task."
  - "Keep the tree green — run make verify-fast and go test ./... before committing."
  - "All capabilities must flow through the universal fastbrain.Engine.Decide port."
  - "Non-overridable safety: IsDestructive checks and circuit breakers must always run before AI evaluation."
  - "Strict timeouts: Fast tier <= 1.5s, Thinking tier <= 10s; graceful fail-open to human waiting_for_input."
done_when:
  - "internal/fastbrain exports the universal Engine and Decide port supporting TierFast and TierThinking."
  - "Universal prompt classifier deterministically categorizes prompts into ToolPermission vs StrategicQuestion."
  - "Engine.ArbitrateApproval resolves tool permissions via TierFast and strategic questions via TierThinking."
  - "internal/poller/poller.go integrates with Fast-Brain to auto-dispatch approved or selected keys."
  - "Full unit and integration test coverage across all 4 supported backends."
tasks:
  - id: Task1_FastBrainGatewayPort
    prompt: >-
      Implement the universal Fast-Brain Gateway port and runner interfaces:
      1) In internal/fastbrain/types.go:
         - Define DecisionKind (KindArbitrateApproval, KindResolveAgentName, etc.).
         - Define Tier (TierFast, TierThinking).
         - Define Request and Response envelopes with JSON sanitization helpers.
         - Define Engine interface with Decide(ctx, Request) (Response, error).
      2) In internal/fastbrain/runner.go:
         - Define Runner interface Run(ctx, prompt) (string, error).
         - Implement NewEngine(fastRunner, thinkingRunner Runner) Engine with timeout management, context cancellation, and telemetry logging.
      3) In internal/fastbrain/classify.go:
         - Implement ClassifyPrompt(a *agentbackend.Approval) PromptCategory.
      4) Add unit tests in internal/fastbrain/classify_test.go and engine_test.go testing the engine and prompt classification across Claude, Codex, Cursor, and Antigravity.
      Ensure go test ./internal/fastbrain/... passes.

  - id: Task2_ArbiterDomainAdapter
    after:
      - Task1_FastBrainGatewayPort
    prompt: >-
      Implement the Arbiter domain logic on top of Engine.Decide:
      1) In internal/fastbrain/arbiter.go:
         - Define ArbiterInput and ArbiterDecision.
         - Implement Engine.ArbitrateApproval(ctx, input) (ArbiterDecision, error) using Decide:
           - Routes ToolPermission to TierFast (<= 1.5s).
           - Routes StrategicQuestion to TierThinking (<= 10s).
           - Enforces confidence thresholds (>= 0.8) and bounds checks on options.
           - Returns DecisionEscalate on timeout, error, or low confidence.
      2) In internal/fastbrain/templates.go:
         - Define compact zero-shot system prompts with strict JSON schemas for both tiers.
      3) Add unit tests in internal/fastbrain/arbiter_test.go mocking both runners:
         - Tool permission approval, rejection, and escalation.
         - Strategic question selection and invalid option handling.
         - Timeout and network error fallback.
      Ensure go test ./internal/fastbrain/... passes.

  - id: Task3_PollerIntegrationAndTests
    after:
      - Task2_ArbiterDomainAdapter
    prompt: >-
      Integrate Fast-Brain arbiter into the Poller approval worker:
      1) In internal/approval/policy.go:
         - Add UseFastBrain bool to Policy.
      2) In internal/poller/poller.go:
         - Wire fastbrain.Engine into Poller.
         - In tryAutoApprove, invoke ArbitrateApproval when static rules do not match or AffirmativeIdx == 0.
         - On DecisionApprove: dispatch a.AffirmativeIdx.
         - On DecisionSelectOption: dispatch strconv.Itoa(decision.SelectedOption).
         - On DecisionEscalate: leave for human / route to brain.
         - Log structured decision rationale and audit event.
      3) Add tests in internal/poller/poller_test.go testing automated tool approvals and question resolution.
      4) Verify make verify-fast and all tests pass. Open a PR against main.
