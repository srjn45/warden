version: 1
name: crash-triage-and-tui-log-viewer
goal: >-
  Implement Fast-Brain crash triage and user-approved bug reporting, and add an in-cockpit
  TUI log viewer with hotkey 'l' in BubbleTea to prevent screen corruption and provide instant log access.
constraints:
  - "Work in an isolated branch/worktree off origin/main; one worker per task."
  - "Keep the tree green — run make verify-fast and go test ./... before committing."
  - "Zero-surprise privacy: Never submit data to GitHub without explicit user approval."
  - "TUI logging must be isolated from stdout/stderr to prevent terminal screen corruption."
done_when:
  - "Fast-Brain classifies crashes (internal_bug, transient_error, environment_error, task_failure)."
  - "Internal bugs generate sanitized GitHub issue drafts with stripped secrets and paths."
  - "CLI command 'warden bug-report <id>' allows reviewing and submitting reports via gh or browser URL."
  - "TUI cockpit hotkey 'l' toggles a scrollable log viewer (modeLogs) mirroring 'c' and 'd'."
  - "Full unit and integration tests pass."
tasks:
  - id: Task1_TUILogViewer
    prompt: >-
      Implement the TUI Log Viewer in internal/tui with hotkey 'l':
      1) In internal/tui/control_pane.go:
         - Define modeLogs mode.
         - In modeNormal, bind 'l' to toggle modeLogs, load logs into m.vp, and jump to bottom.
         - In modeLogs, handle 'esc'/'l' to close, 'g'/'G' to top/bottom, and arrows/pgup/pgdn to scroll.
         - In View, render titleBox("Logs (esc / l to close · G bottom · g top)", m.vp.View(), m.w, m.bodyH()).
      2) In internal/tui/logging.go:
         - Implement logTailReader to read the last N lines of ~/.warden/tui.log with log-level ANSI coloring.
         - Ensure all log outputs in full-screen TUI are safely isolated from stdout/stderr.
      3) Add unit tests in internal/tui/control_pane_test.go verifying 'l' toggles modeLogs and scrolls.
      Ensure go test ./internal/tui/... passes.

  - id: Task2_FastBrainCrashTriageAndSanitization
    after:
      - Task1_TUILogViewer
    prompt: >-
      Implement Crash Triage and Secret/Path Sanitization:
      1) In internal/triage/types.go:
         - Define TriageInput and TriageReport (ID, Category, IsWardenBug, SanitizedLog, IssueTitle, IssueBody, ActionHint).
      2) In internal/triage/sanitize.go:
         - Implement SanitizeLog(raw string) string: redacts API keys (sk-..., AIza...), tokens (ghp_...), bearer headers, and normalizes home paths (/home/... -> ~/).
      3) In internal/fastbrain/arbiter.go (or triage.go):
         - Implement Engine.DiagnoseFailure(ctx, in TriageInput) (TriageReport, error) via Engine.Decide(KindDiagnoseFailure, TierFast).
      4) Add unit tests in internal/triage/sanitize_test.go verifying regex redaction of keys and paths.
      Ensure go test ./internal/triage/... passes.

  - id: Task3_BugReportCLIAndApprovalFlow
    after:
      - Task2_FastBrainCrashTriageAndSanitization
    prompt: >-
      Implement user-approved bug reporting CLI and Poller hook:
      1) In internal/triage/store.go:
         - Implement Local crash report storage under ~/.warden/crashes/<id>.json.
      2) In internal/cli/bug_report.go:
         - Implement `warden bug-report [id]`: lists recent crashes or previews a specific report.
         - Prompts user: `Submit this bug report to https://github.com/srjn45/warden/issues? [y/N]`.
         - On 'y', executes `gh issue create` if authenticated, or prints pre-filled GitHub issue URL.
      3) In internal/poller/poller.go:
         - When an agent exits with StatusErrored (non-137), call DiagnoseFailure in background.
         - If IsWardenBug is true, raise Anomaly / notification with the crash ID.
      4) Add CLI tests in internal/cli/ and verify make verify-fast passes. Open PR against main.
