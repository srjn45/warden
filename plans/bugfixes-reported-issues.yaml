version: 1
goal: >-
  Fix the three reported GitHub issues (#465, #464, #274):
  1) Resolve runaway TUI terminal auto-spawning by adding circuit-breaker and rate-limiting backoff in the TUI control pane.
  2) Fix 422 ErrNoTranscript failure in restore_agent and SwitchRole for cursor-backend agents (and any non-structured-transcript backends).
  3) Fix MCP git tools (commit, push, sync, check, snapshot) ignoring the explicit dir parameter, replacing silent worktree overrides with proper worktree validation and boundary enforcement.
constraints:
  - "Work in an isolated git worktree branched off origin/main or the plan integration branch; one worker per task."
  - "Keep the tree green — run `wd check` (or make verify-fast) before every commit/push."
  - "API is spec-first — if OpenAPI schema changes, edit internal/daemon/apidocs/openapi.yaml then `make generate`; never hand-edit generated code (api.gen.go)."
  - "Open PRs against autopilot/bugfixes-reported-issues (never main)."
  - "End each task with `wd job done --summary '...'` once the PR is up and gate is green."
tasks:
  - id: Task1_FixIssue465_TerminalSpawnLoop
    prompt: >-
      Fix Issue #465 (runaway terminal spawn loop in TUI cockpit & safety circuit-breaker):
      In internal/tui/control_pane.go, reconcileTerminalPaneCmd() ensures at least one live terminal exists.
      However, it currently lacks rate limiting, retry backoff, or a circuit breaker. If liveTerminals() is empty
      (e.g., due to slow daemon response, listing error, or startup race), it triggers spawnTerminalCmd repeatedly
      on every cycle without delay, which caused ~150 terminals to spawn in 17 seconds.
      1) In internal/tui/control_pane.go, add an exponential backoff and circuit-breaker to terminal auto-spawning:
         track spawn attempts, last spawn timestamp, and backoff duration (e.g., 2s initial, doubling up to 30s).
      2) If live terminals remain 0 after multiple consecutive attempts (e.g. 3 attempts), trip the circuit-breaker,
         log a warning / set status banner in the TUI, and suspend auto-spawning until the user manually requests a terminal.
      3) Reset the attempt counter once a live terminal is successfully confirmed in m.sessions.
      4) Add regression unit tests in internal/tui/control_pane_test.go (or terminal_test.go) verifying that empty
         terminal listings do not trigger unbounded rapid spawns.
      Ensure `wd check` passes before opening a PR against autopilot/bugfixes-reported-issues.
      End with `wd job done --summary 'fix(tui): add circuit breaker and backoff to terminal auto-spawn loop (#465)'`.

  - id: Task2_FixIssue464_CursorRestore
    prompt: >-
      Fix Issue #464 (restore_agent always 422s for cursor-backend agents due to missing transcript reader):
      In internal/lifecycle/lifecycle.go, Restore (line 1912) and SwitchRole (line 1945) unconditionally check:
        if l.transcriptPath(sess) == "" { return ErrNoTranscript }
      which maps to HTTP 422 Unprocessable Entity.
      For the Cursor backend (internal/agentbackend/backends/cursor.go), TranscriptPath() returns ("", false)
      because interactive Cursor sessions store chat history in internal SQLite databases (~/.cursor/chats/.../store.db),
      not flat .jsonl files. However, Cursor supports resume via `cursor-agent --continue` within the worktree,
      declares Caps.Resume = true, and does not require an on-disk transcript file from warden to resume.
      1) In internal/lifecycle/lifecycle.go (in both Restore and SwitchRole), guard the l.transcriptPath(sess) check:
         only require l.transcriptPath(sess) != "" if the backend declares structured transcripts
         (b.Capabilities().StructuredTranscript == true).
      2) For backends with Caps.Resume = true but StructuredTranscript = false (like Cursor), bypass the ErrNoTranscript
         guard and allow resumeInTmux to proceed.
      3) Add unit tests in internal/lifecycle/lifecycle_test.go confirming that Restore and SwitchRole succeed for a
         backend with Resume: true and StructuredTranscript: false when worktree exists, even without a transcript file.
      Ensure `wd check` passes before opening a PR against autopilot/bugfixes-reported-issues.
      End with `wd job done --summary 'fix(lifecycle): permit restore for backends without structured transcripts (#464)'`.

  - id: Task3_FixIssue274_McpDirPinning
    prompt: >-
      Fix Issue #274 (MCP commit ignores dir param and commits against current working directory):
      In internal/daemon/git_routes.go, pinnedWorkdir() resolves the working directory for git operations:
        if session != "" {
          got, err := s.store.Get(ctx, session)
          if err == nil && sess.Workdir != "" {
            resolved = sess.Workdir // authoritative: pin to the agent's own worktree
          }
        }
      When called via MCP (internal/mcp/server.go), sessionID() is automatically provided from WARDEN_SESSION_ID.
      If a caller explicitly passes a worktree directory via `dir` (e.g. `{ "dir": "/tmp/wt", "message": "fix" }`),
      pinnedWorkdir() silently ignores `dir` and overwrites it with sess.Workdir (the main checkout or peer branch),
      causing git commit/push/sync/check/snapshot to run in the wrong worktree.
      1) Update pinnedWorkdir() in internal/daemon/git_routes.go:
         - If dir is empty or matches sess.Workdir, use sess.Workdir.
         - If dir is explicitly provided and differs from sess.Workdir, check if dir is a valid worktree/directory
           belonging to the session's repository (e.g., share the same git repository root as sess.Repo / sess.Workdir).
         - If dir belongs to the session's repo, honor resolved = dir.
         - If dir does NOT belong to the session's repository, reject the request with an explicit error
           (400/403: requested dir is outside the agent's repository/worktree) instead of silently committing sess.Workdir.
      2) Ensure internal/mcp/server.go properly passes and documents mcpDir(a.Dir) for commit, push, sync, check, snapshot.
      3) Add unit tests in internal/daemon/git_routes_test.go verifying:
         - Valid worktree dir for the session is honored and committed.
         - Spoofed/unrelated dir outside the repository is rejected with an error instead of silently falling back to sess.Workdir.
      Ensure `wd check` passes before opening a PR against autopilot/bugfixes-reported-issues.
      End with `wd job done --summary 'fix(daemon,mcp): honor explicit dir and validate worktree boundaries (#274)'`.

  - id: Task4_VerifyAndE2E
    prompt: >-
      Verification & Definition-of-Done pass:
      1) Verify `wd check` passes cleanly (build, fmt, lint, tests).
      2) Verify end-to-end scenarios for all three issues (#465, #464, #274).
      3) Ensure all documentation and test suites are consistent.
      Open PR against autopilot/bugfixes-reported-issues.
      End with `wd job done --summary 'test(e2e): verify fixes for issues #465, #464, and #274'`.
    after: [Task1_FixIssue465_TerminalSpawnLoop, Task2_FixIssue464_CursorRestore, Task3_FixIssue274_McpDirPinning]

done_when:
  - "wd check passes on autopilot/bugfixes-reported-issues."
  - "Issue #465 fixed: TUI terminal reconciler has backoff and circuit-breaker; no runaway spawn loop can occur."
  - "Issue #464 fixed: restore_agent and SwitchRole succeed for cursor-backend agents without 422 ErrNoTranscript."
  - "Issue #274 fixed: MCP git tools (commit, push, sync, check, snapshot) honor explicit dir with worktree validation and reject invalid paths."
  - "All tests pass without flakes."
