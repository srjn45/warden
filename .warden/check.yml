# warden's own checks, run by `wd check` / mcp__warden__check.
# One declaration drives both the runner and (Phase 0c-2) the test-redirect hook,
# so an agent that types `go test ./...` gets pointed at `wd check test`.
check:
  test:  go test ./...
  lint:  go vet ./...
  fmt:   test -z "$(gofmt -l $(git ls-files '*.go'))" || { gofmt -l $(git ls-files '*.go'); false; }
  build: go build ./...
