        role: { type: string, description: "agent role the schedule spawns; absent = worker with a repo, else general" }
        prompt: { type: string }
        agent: { type: string }
        branch: { type: string }
        model: { type: string, description: "model ID for ai_cli; absent = resolver/default" }
        ai_cli: { type: string, description: "AI CLI the agent runs; absent = the daemon's default" }
        permission_mode: { type: string }
        auto_restart: { type: boolean }
        tags: { type: array, items: { type: string } }
        tier: { type: string }
        project_id: { type: string, description: "project the spawned agent joins; absent = resolved from the launch directory at fire time" }
        spec: { type: string }
        created_at: { type: string, format: date-time }
        last_run: { type: string, format: date-time, description: "time of the most recent fire; absent if never fired" }
