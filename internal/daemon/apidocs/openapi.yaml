      x-go-type: pipeline.Pipeline
      x-go-type-import:
        path: github.com/srjn45/warden/internal/pipeline
        name: pipeline
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        repo: { type: string }
        status: { type: string }
        schedule_id: { type: string, description: "schedule that created this pipeline, when scheduled" }
        schedule_name: { type: string, description: "operator-facing name of that schedule" }
        plan_id:
          type: string
          description: "back-ref to the plan this pipeline is executing; absent for pipelines not created from a plan"
        project_id:
          type: string
          description: >-
            back-ref to the first-class project (GET /api/v1/projects) this
            pipeline belongs to; empty/absent = ungrouped. Set at creation from
            the request body project_id, the YAML spec, or by matching the
            pipeline repo to an OPEN project. Groups a pipeline and all its job
            agents under one parent project.
        parent_agent_id:
          type: string
          description: >-
            back-ref to the agent (GET /api/v1/sessions) that created or escalated
            this pipeline (project entity hierarchy D6); empty/absent =
            operator-created (no owning agent). Set at creation from the request
            body parent_agent_id or the identity of the agent behind the request.
            It is the reverse edge of the owning agent's child_pipelines[]: a
            nested pipeline appears in both directions. Job agents are NOT owned
            this way (D5) — they carry pipeline_id and belong to the pipeline.
        tags:
          type: array
          items: { type: string }
          description: >-
            Labels stamped onto every job agent this pipeline spawns. Set by the
            daemon at creation time (not spec-authored) — e.g. autopilot
            ownership tags inherited from the creating agent.
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PipelineJob" }
        job_count:
          type: integer
          description: Number of user-authored jobs (synthetic jobs excluded).
        jobs_done:
          type: integer
          description: Number of user-authored jobs whose status is done.

    Tree:
      x-go-type: tree.Tree
      x-go-type-import:
        path: github.com/srjn45/warden/internal/tree
        name: tree
      type: object
      description: >-
        The top-level project-tree frame. Returned by GET /api/v1/tree and
        carried verbatim in the SSE `tree` event.
      required: [roots]
      properties:
        roots:
          type: array
          description: >-
            Ordered root nodes: registered projects (open first, then closed),
            loose-dir groups, then the synthetic "No project" bucket last.
            Never null — an empty fleet returns [].
          items: { $ref: "#/components/schemas/TreeNode" }
        degraded:
          type: boolean
          description: >-
            A subsystem (pipelines/autopilot) failed and its subtree is marked in
            place; the rest of the tree is still trustworthy. Distinct from a 503
            (the whole session scan is degraded). Omitted when false.
        truncated:
          type: boolean
          description: >-
            A soft node cap was hit and some children were elided. Omitted when
            false.

    TreeNode:
      x-go-type: tree.Node
      x-go-type-import:
        path: github.com/srjn45/warden/internal/tree
        name: tree
      type: object
      description: >-
        One node in the hierarchy under a uniform envelope. An unrecognized
        `type` still renders generically from label/status/children. Structure
        only — session detail (repo/branch/backend/model/spend) is joined
        client-side via session_id against /sessions; no node embeds a session.
      required: [type, id, label, status]
      properties:
        type:
          type: string
          description: >-
            Node type: project | section | plan | agent | terminal | pipeline | job |
            autopilot_run | manager | guardian | task | worker.
          enum: [project, section, plan, agent, terminal, pipeline, job, autopilot_run, manager, guardian, task, worker]
        id:
          type: string
          description: >-
            Composite, stable id minted from structure (e.g. session:<id>,
            project:<id>, pipeline:<id>/job:<id>, run:<id>/task:<id>). Opaque —
            clients key view state off it and never parse it.
        label: { type: string, description: display name, node-supplied }
        status:
          type: string
          description: >-
            Agent nodes use pending | busy | idle | need-input | done | orphaned |
            rate_limited (entity hierarchy spec section 4). Containers, jobs,
            pipelines and runs retain their existing rollup vocabulary. Terminals
            use only busy, done or orphaned for liveness.
          enum: [active, waiting, idle, done, error, blocked, unknown, pending, busy, need-input, orphaned, rate_limited]
        session_id:
          type: string
          description: >-
            REFERENCE only, on session-backed nodes (agent/terminal/manager/
            guardian/worker, and a job once it has spawned). Join detail against
            /sessions. Omitted on structural nodes.
        detail: { $ref: "#/components/schemas/TreeNodeDetail" }
        children:
          type: array
          description: >-
            Ordered by the node (never re-sorted by clients). Omitted when empty.
          items: { $ref: "#/components/schemas/TreeNode" }

    TreeNodeDetail:
      x-go-type: tree.Detail
      x-go-type-import:
        path: github.com/srjn45/warden/internal/tree
        name: tree
      type: object
      description: >-
