        repository_path:
          type: string
          description: "Absolute local git repository path (defaults to the plan's project root)"
        format:
          type: string
          enum: [yaml, json]
          default: yaml
          description: "Replica encoding (default yaml). json writes plans/{lifecycle}/<slug>.json"
        output_path:
          type: string
          description: "Optional override for the replica path; default plans/{lifecycle}/<slug>.{yaml|json}"
        repository:
