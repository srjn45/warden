            `role` wins.
        tier: { type: string, description: "explicit model tier (tier-1|tier-2|tier-3) for the quota-balanced resolver that picks the AI CLI+model at spawn. Empty derives the tier from task, then role. A pinned ai_cli/model still wins over the resolver." }
        task: { type: string, description: "task name (task registry) used to derive the model tier via the task→tier map when tier is empty. Empty = none." }
        fork_from:
          type: string
          description: >
            id of an existing agent whose recorded session this spawn should FORK
            (codex fork): the new agent branches the source agent's conversation
            into a divergent session. Requires an AI CLI implementing SessionForker
