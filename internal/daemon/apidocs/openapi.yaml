openapi: 3.0.3
info:
  title: warden daemon API
  version: "1.0.0"
  description: |
    REST API for the **warden** daemon — the long-running process that spawns,
    supervises, and coordinates Claude Code agent sessions.

    ## Authentication

    Every data- and action-bearing route is gated by a **bearer token**
    (`Authorization: Bearer <token>`) whenever the daemon is configured for
    non-loopback access (a token is set, or `WARDEN_TOKEN` is exported). In the
    default loopback-only mode no token is set and authentication is disabled, so
    the header is ignored. SSE/WebSocket clients that cannot set headers may pass
    the token as a `?token=` query parameter instead.

    The liveness probe (`/healthz`) and the documentation surface (`/api/docs`,
    `/api/docs/openapi.yaml`) are **public** — like the static SPA shell — so a
    proxy/tunnel health check and the docs UI load without a token.

    ## Source of truth

    This document is derived directly from the routes registered in
    `internal/daemon` (`server.go` + the `register*Routes` helpers). A drift-guard
    test (`apidocs_routes_test.go`) asserts every concrete route in the daemon's
    chi mux has a matching path here, and vice versa.
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback bind (no auth)
  - url: /
    description: Same-origin (relative)
tags:
  - name: Documentation
    description: OpenAPI spec + interactive docs (public)
  - name: Health
    description: Liveness
  - name: Sessions
    description: Agent session lifecycle and inspection
  - name: Events
    description: Hook events and the live SSE stream
  - name: Git
    description: Rail-enforcing git lifecycle (commit/push/sync/check) and worktrees
  - name: Approvals
    description: Permission-prompt inbox
  - name: Context
    description: Shared inter-agent key/value blackboard
  - name: Messages
    description: Directed inter-agent mailbox
  - name: Collaboration
    description: Inter-agent file-conflict view
  - name: Pipelines
    description: Multi-stage DAG pipelines of dependent jobs
  - name: Projects
    description: First-class projects that agents and pipelines group under
  - name: Plans
    description: First-class plan tracking (docs/specs/2026-09-28-plans-first-class.md)
  - name: Snapshots
    description: Worktree + transcript checkpoints
  - name: Savings
    description: Measured token reductions earned by lifecycle features
  - name: Schedules
    description: Recurring (cron) and single-shot (at) agent/pipeline triggers
  - name: Observability
    description: Memory pressure, metrics, history, search
  - name: Filesystem
    description: Directory browsing for the spawn picker
  - name: Import/Export
    description: Session record import

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Health]
      summary: Liveness probe
      description: Public. Pings the store; returns 503 if the store is unavailable.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Health]
      summary: Server capability flags
      description: >
        The optional capabilities this warden daemon supports, as stable string
        flags a client feature-detects against (version-skew negotiation). The
        flag "terminal-sessions" means this daemon understands the session `kind`
        field: it accepts kind=terminal on spawn, supports ?kind= on session list,
        sets `kind` on every session row, and no longer lists `terminal` as a
        backend. A client keys on the flag; absence of `terminal` from
        GET /api/v1/backends is the fallback signal for older daemons.
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilitiesResponse" }

  /api/v1/store/health:
    get:
      operationId: getStoreHealth
      tags: [Health]
      summary: Session-store health
      description: >
        Reports whether the active session store can be read completely. warden
        keeps the active fleet complete-or-error: if any active record cannot be
        decoded (or the underlying segment scan fails), a fleet read returns an
        explicit degradation instead of a silently-short list. This endpoint
        surfaces that state for operator diagnostics and for the TUI's
        last-known-good banner: `healthy=false` with per-failure diagnostics
        (collection, key, failure class, detail) when the active scan is degraded,
        `healthy=true` with an empty failure list otherwise. It always returns 200
        — the health verdict is in the body, not the status code — so a monitoring
        client can distinguish "store is degraded" from "daemon is unreachable".
      responses:
        "200":
          description: Store health verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreHealth" }

  /api/docs:
    get:
      operationId: getApiDocs
      tags: [Documentation]
      summary: Interactive API docs (Swagger UI)
      description: |
        Public. Serves an embedded, offline Swagger UI pointed at the embedded
        spec. Gated by the `api_docs` config setting (default on); returns 404
        when disabled.
      security: []
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Docs disabled (api_docs=false)

  /api/docs/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [Documentation]
      summary: Raw OpenAPI document
      description: Public. Serves this specification. Gated by `api_docs` (404 when disabled).
      security: []
      responses:
        "200":
          description: The OpenAPI 3.x document
          content:
            application/yaml:
              schema: { type: string }
        "404":
          description: Docs disabled (api_docs=false)

  /api/v1/sessions:
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List active sessions
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [agent, terminal] }
          description: >
            filter by session kind: "agent" returns only AI agents (sessions with
            kind empty or "agent"), "terminal" returns only plain shells. Omitted =
            every session, agents and terminals alike (unchanged default).
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Include system sessions. Omitted or false hides sessions tagged system:true.
      responses:
        "200":
          description: All live sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }

  /api/v1/sessions/{id}:
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Get one session by id or name
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404":
          description: Session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/spawn:
    post:
      operationId: spawnAgent
      tags: [Sessions]
      summary: Spawn a new agent
      description: |
        Launches a new Claude Code agent (typed or free-form). When the
        memory-pressure spawn gate warns, returns 428 with a confirmation payload;
        retry with `force: true` to proceed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpawnRequest" }
      responses:
        "201":
          description: The spawned session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "428":
          description: Spawn gate warning — re-submit with force=true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmationResponse" }

  /api/v1/adopt:
    post:
      operationId: adoptSession
      tags: [Sessions]
      summary: Adopt an existing (un-spawned) session
      description: Registers a resume- or live-mode session warden did not spawn.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdoptRequest" }
      responses:
        "201":
          description: The adopted session (plus an optional non-fatal warning)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdoptResponse" }

  /api/v1/sessions/{id}/terminate:
    post:
      operationId: terminateSession
      tags: [Sessions]
      summary: Terminate an agent
      description: Kills the agent's tmux session; keeps the record and worktree.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/delete:
    post:
      operationId: deleteSession
      tags: [Sessions]
      summary: Delete a session record
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteRequest" }
      responses:
        "200":
          description: Deleted (warning set when the agent may still be live)
          content:
            application/json:
              schema:
                type: object
                required: [status, warning]
                properties:
                  status: { type: string }
                  warning: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/remove-worktree:
    post:
      operationId: removeWorktree
      tags: [Sessions]
      summary: Remove the session's git worktree + branch
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveWorktreeRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/input:
    post:
      operationId: sendInput
      tags: [Sessions]
      summary: Send text input to an agent's pane
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InputRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/output:
    get:
      operationId: getOutput
      tags: [Sessions]
      summary: Read recent pane output
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - name: lines
          in: query
          description: Number of trailing lines to capture
          schema: { type: integer }
      responses:
        "200":
          description: Captured output
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/attach:
    get:
      operationId: attachSession
      tags: [Sessions]
      summary: Attach to an agent's pane (WebSocket)
      description: |
        Upgrades to a WebSocket carrying the live tmux pane (terminal multiplexing).
        Not a request/response endpoint; a successful handshake returns 101.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/cockpit/attach:
    get:
      operationId: attachCockpit
      tags: [Sessions]
      summary: Attach to the web cockpit / TUI (WebSocket)
      description: |
        Upgrades to a WebSocket carrying the daemon-owned three-pane cockpit
        (agent list + master shell/REPL + detail pane) — the same `warden tui`,
        rendered into the browser. The cockpit is built lazily on first attach
        and shared across clients. Not a request/response endpoint; a successful
        handshake returns 101.
      responses:
        "101":
          description: Switching Protocols (WebSocket)

  /api/v1/sessions/{id}/restore:
    post:
      operationId: restoreSession
      tags: [Sessions]
      summary: Restore (re-create + resume) a lost session
      description: >-
        Recreates the agent's tmux session and resumes its prior conversation.
        Spec D8: this operator recovery endpoint is allowed only when the
        session status is `orphaned`; other states return 409. Project
        hibernation reopen, auto-restart, rate-limit resume, and backend
        recovery use the shared lifecycle resume primitive directly and are
        not gated by this endpoint.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Session is not orphaned (or already running)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Restore preconditions failed (no session id, workdir, or transcript)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/sessions/{id}/create-pr:
    post:
      operationId: createPR
      tags: [Sessions]
      summary: Open a GitHub PR for the agent's branch
      description: Push → digest → gh pr create. An existing PR returns Created=false.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base: { type: string, description: "PR base branch ('' = main)" }
                title: { type: string, description: "Explicit PR title; when set it is used verbatim (no Fast-Brain draft)" }
                body: { type: string, description: "Explicit PR body; when set it is used verbatim (no Fast-Brain draft)" }
      responses:
        "200":
          description: PR result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PRResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/digest:
    get:
      operationId: getDigest
      tags: [Sessions]
      summary: Completion digest for an agent
      description: LLM narrative summary + changed files + branch/turns/status.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: The digest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Digest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/auto-approve:
    patch:
      operationId: setAutoApprove
      tags: [Approvals]
      summary: Toggle auto-approve for an agent
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new auto-approve state
          content:
            application/json:
              schema:
                type: object
                required: [auto_approve]
                properties:
                  auto_approve: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/force-compact:
    patch:
      operationId: setForceCompact
      tags: [Sessions]
      summary: Set an agent's force-compact override (on / off / inherit)
      description: >-
        Controls the destructive force-compact path for one agent, overriding the
        global token_force_compact. enabled=true forces it on, false forces it
        off, and null/omitted clears the override so the agent inherits the global
        setting.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [on, off, inherit]
      responses:
        "200":
          description: The new force-compact override (inherit = use global)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [on, off, inherit]
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/permission-mode:
    patch:
      operationId: setPermissionMode
      tags: [Sessions]
      summary: Set an agent's permission mode
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permission_mode:
                  type: string
                  enum: [auto, default, acceptEdits, bypassPermissions, dontAsk, plan]
      responses:
        "200":
          description: The new permission mode
          content:
            application/json:
              schema:
                type: object
                required: [permission_mode]
                properties:
                  permission_mode: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/role:
    patch:
      operationId: setRole
      tags: [Sessions]
      summary: Set an agent's built-in role
      description: >
        Persists the agent's built-in role name (empty ⇒ general). The role's
        persona is re-resolved from the registry and re-injected the next time the
        agent is (re)launched/resumed — mirroring how permission-mode takes effect.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: "built-in role name (general|orchestrator|implementer|auto-merger|reviewer); empty = general"
      responses:
        "200":
          description: The new role
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/switch:
    post:
      operationId: switchSession
      tags: [Sessions]
      summary: Hot-swap an agent session to a different backend, model, or tier mid-task
      description: >
        Mid-session hot-swap: retire the active CLI process and launch a successor backend
        in the SAME worktree, carrying forward structured context (Goal, Decisions Log,
        Modified Files Diff, Immediate Next Step) so the new agent continues without starting cold.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ai_cli:
                  type: string
                  description: "explicit successor AI CLI id (e.g. antigravity). Canonical; preferred over deprecated `backend`."
                backend:
                  type: string
                  deprecated: true
                  description: "Deprecated alias for `ai_cli`. When both are provided, `ai_cli` wins."
                model:
                  type: string
                  description: "explicit successor model id"
                tier:
                  type: string
                  description: "resolve successor via quota-balanced router at this tier (tier-1 | tier-2 | tier-3)"
                role:
                  type: string
                  description: "role to resolve tier from when tier is not given"
                reason:
                  type: string
                  description: "reason recorded for hot-swap (manual | context_fill | quota)"
                prompt:
                  type: string
                  description: "optional extra instruction appended to successor's continuation prompt"
      responses:
        "200":
          description: Hot-swap result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwapResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: Hot-swap execution failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [Sessions]
      summary: List the built-in agent roles
      description: >
        Returns warden's fixed built-in roles (general first, then alphabetical)
        so UIs and clients can present a role picker. Read-only.
      responses:
        "200":
          description: The built-in roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/RoleInfo" }

  /api/v1/roles/tiers:
    get:
      operationId: listRoleTiers
      tags: [Sessions]
      summary: List role-to-tier mappings
      description: >
        Returns default model tier mappings for agent roles. Read-only.
      responses:
        "200":
          description: List of role-to-tier mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleTierMapping" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/roles/tiers/{role}:
    put:
      operationId: setRoleTier
      tags: [Sessions]
      summary: Set the default model tier for an agent role
      description: >
        Updates the default model tier (tier-1 | tier-2 | tier-3) assigned when
        creating agents with this role. Returns the updated mapping.
      parameters:
        - name: role
          in: path
          required: true
          schema: { type: string }
          description: Role name (e.g. architecture, implementation, triage, code-review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  description: "tier-1 | tier-2 | tier-3"
      responses:
        "200":
          description: The updated role-to-tier mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleTierMapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/models:
    get:
      operationId: listModels
      tags: [Sessions]
      summary: List models in the catalog and their assigned tiers
      description: >
        Returns models registered in the catalog, optionally filtered by tier
        (tier-1, tier-2, tier-3). Read-only.
      parameters:
        - name: tier
          in: query
          required: false
          schema:
            type: string
            description: "Optional tier filter: tier-1 | tier-2 | tier-3"
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/models/{backend}/{model}/tier:
    put:
      operationId: setModelTier
      tags: [Sessions]
      summary: Set a model's tier classification
      description: >
        Updates the tier classification (tier-1 | tier-2 | tier-3) for a model
        in the catalog. Returns the updated model entry.
      parameters:
        - name: backend
          in: path
          required: true
          schema: { type: string }
          description: Backend ID (e.g. claude, antigravity, codex)
        - name: model
          in: path
          required: true
          schema: { type: string }
          description: Model ID (e.g. sonnet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  description: "tier-1 | tier-2 | tier-3"
      responses:
        "200":
          description: The updated model entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/handover/settings:
    get:
      operationId: getHandoverSettings
      tags: [Sessions]
      summary: Get handover configuration
      description: >
        Returns the current configuration for mid-session context handover and quota headroom triggers.
      responses:
        "200":
          description: Current handover settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverSettings" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: setHandoverSettings
      tags: [Sessions]
      summary: Update handover configuration
      description: >
        Persists the handover configuration for mid-session context handover and quota headroom triggers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoverSettings" }
      responses:
        "200":
          description: Updated handover settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/backends:
    get:
      operationId: listBackends
      tags: [Sessions]
      summary: Get the agent-backend registry with settings
      description: >
        Returns the persisted agent-backend registry (one row per detected
        backend, sorted by id) plus the store-level settings singleton. The
        registry is warden's source of truth for which backends exist, their
        tier, which one is the default, and whether each is enabled. Detection
        fields (installed/binary_path/detected_at) reflect the most recent
        reconcile — POST /api/v1/backends/rescan to refresh them. Read-only.
      responses:
        "200":
          description: The backend registry and settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendsState" }

  /api/v1/usage:
    get:
      operationId: getUsage
      tags: [Observability]
      summary: Get subscription-backend provider usage
      description: >
        Concurrently queries every persisted backend whose tier is exactly
        subscription. This read does not rescan or mutate registry, routing,
        cooldown, or quota state. Provider errors are sanitized and successful
        rows are retained when another provider fails.
      parameters:
        - name: refresh
          in: query
          description: Bypass the 60-second fresh cache (stale fallback remains available).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Consolidated provider usage snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Backend registry or usage service unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/usage/recover:
    post:
      operationId: recoverUsage
      tags: [Observability]
      summary: Operator-triggered one-shot usage reconciliation
      description: >
        Explicit operator action that fetches fresh supported provider usage
        snapshots, calculates bucket-to-agent impact, and (unless dry_run)
        invokes precisely the same reconciliation / backend-recovery coordinator
        flow as the background usage reconciliation loop
        (docs/specs/2026-09-29-usage-api-quota-recovery.md). Always refreshes
        provider data for the filtered scope — cached or stale snapshots are
        never treated as forced exhaustion evidence. Optional ai_cli and project
        filters limit which agents may be affected; unrelated agents are left
        untouched. max_parallel_swaps temporarily overrides the coordinator's
        bounded concurrency for this invocation when set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsageRecoverRequest" }
      responses:
        "200":
          description: Fresh snapshots, impact, and started/waiting outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageRecoverResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Usage service or recovery coordinator unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/backends/rescan:
    post:
      operationId: rescanBackends
      tags: [Sessions]
      summary: Re-detect installed backends and return the registry
      description: >
        Sweeps PATH for every registered backend and reconciles the detection
        fields (installed/binary_path/detected_at) into the registry, preserving
        each backend's tier/default/enabled preferences. Returns the refreshed
        registry and settings.
      responses:
        "200":
          description: The refreshed backend registry and settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendsState" }

  /api/v1/backends/default:
    put:
      operationId: setDefaultBackend
      tags: [Sessions]
      summary: Set the default agent backend
      description: >
        Marks one backend as the single default (an empty SpawnRequest.backend
        resolves to it). Rejects an unknown, uninstalled, or disabled backend,
        and the reserved local/terminal rows, with a 4xx. Returns the updated
        registry and settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: The updated backend registry and settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendsState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/backends/thinking-mode:
    put:
      operationId: setThinkingMode
      tags: [Sessions]
      summary: Set the internal-thinking routing mode
      description: >
        Sets how warden routes its own internal (non-user-facing) thinking:
        local_only keeps it on the $0 local model; free_plus_local prefers free
        cloud backends and falls back to the never-limited local model. Returns
        the updated settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  description: "local_only | free_plus_local"
      responses:
        "200":
          description: The updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/backends/{id}:
    patch:
      operationId: patchBackend
      tags: [Sessions]
      summary: Update a backend's tier or enabled flag
      description: >
        Updates a single backend's user preferences. tier assigns a billing
        class (free, subscription, pay_per_use, or unclassified); the reserved
        local tier is system-set and cannot be assigned, nor can the local
        row be re-tiered. enabled toggles whether the backend may be used. Both
        fields are optional — an omitted field is left unchanged. Returns the
        updated backend.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  x-go-type: "*string"
                  description: "free | subscription | pay_per_use | unclassified (omit to leave unchanged)"
                enabled:
                  type: boolean
                  x-go-type: "*bool"
                  description: "omit to leave unchanged"
      responses:
        "200":
          description: The updated backend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backend" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List first-class projects
      description: >
        Returns every persisted project (docs/specs/2026-08-28-project-centric-ui.md
        Phase 1), sorted by display name. A project is the parent that agents and
        pipelines group under via their project_id; worktrees are not projects of
        their own. Closed projects are hibernated (kept, not deleted) and are
        returned here with status "closed" so a client can filter them. Read-only.
      responses:
        "200":
          description: The project list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }

  /api/v1/projects/open:
    post:
      operationId: openProject
      tags: [Projects]
      summary: Register a project and mark it open
      description: >
        Registers a project by its canonical id (the main checkout's local path or
        the remote URL) and marks it open. A first open inserts the row; reopening a
        previously closed project flips it back to open. An empty name or path
        leaves the stored value unchanged, so reopening by id alone never blanks the
        display name. Phase 1 only persists the record — the git clone/init
        mechanics are Phase 2. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenProjectRequest" }
      responses:
        "200":
          description: The opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/projects/{id}/close:
    post:
      operationId: closeProject
      tags: [Projects]
      summary: Hibernate (close) a project
      description: >
        Marks a project closed (IDE-like hibernation): the record is kept, only its
        status flips, and it is hidden from the active cockpit/TUI surfaces until
        reopened. Never deletes the project. Returns the updated project, or 404 if
        the id is unknown.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The closed project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/local:
    post:
      operationId: openLocalProject
      tags: [Projects]
      summary: Open an existing local directory as a project
      description: >
        Normalizes the given directory path to an absolute, symlink-resolved path,
        registers it as a project (id = path = the resolved absolute path), and
        marks it open (docs/specs/2026-08-28-project-centric-ui.md Phase 2, Local).
        The directory must already exist. When name is empty the directory's base
        name is used. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenLocalProjectRequest" }
      responses:
        "200":
          description: The opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/projects/remote:
    post:
      operationId: openRemoteProject
      tags: [Projects]
      summary: Clone a remote URL into the workspace and open it as a project
      description: >
        Clones a GitHub/GitLab URL via `git clone` into <workspace_path>/<repo-name>
        (workspace_path from the live config), registers the clone as a project
        (id = path = the clone destination), and marks it open
        (docs/specs/2026-08-28-project-centric-ui.md Phase 2, Remote). When name is
        empty the repository name derived from the URL is used. Fails if the
        destination already exists. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenRemoteProjectRequest" }
      responses:
        "200":
          description: The cloned and opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/projects/new:
    post:
      operationId: createProject
      tags: [Projects]
      summary: Scaffold a new project in the workspace and open it
      description: >
        Creates <workspace_path>/<name>, runs `git init`, writes a template
        README.md, then `git add . && git commit`, registers the directory as a
        project (id = path = the new directory), and marks it open
        (docs/specs/2026-08-28-project-centric-ui.md Phase 2, New). Fails if the
        target directory already exists. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProjectRequest" }
      responses:
        "200":
          description: The created and opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/project-groups:
    get:
      operationId: listProjectGroups
      tags: [Projects]
      summary: List project groups
      description: >
        Returns every project group (Project Groups feature, Phase 1), sorted by
        display name. A group is a named collection of projects; a project may
        belong to zero or one group. The TUI shows a project's group beside its
        name. Read-only.
      responses:
        "200":
          description: The project group list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroupList" }
    post:
      operationId: createProjectGroup
      tags: [Projects]
      summary: Create a project group
      description: >
        Creates a new named group holding an optional initial set of project ids.
        The name is required; the id is minted by the store when omitted. Member
        ids are de-duplicated and need not resolve to existing projects. Returns the
        created group (including its minted id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectGroupRequest" }
      responses:
        "200":
          description: The created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/project-groups/{id}:
    get:
      operationId: getProjectGroup
      tags: [Projects]
      summary: Get one project group
      description: Returns the group with the given id, or 404 if it is unknown.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProjectGroup
      tags: [Projects]
      summary: Update a project group
      description: >
        Full-replace / bulk-set path: overwrites the group's name and entire
        membership in place. The name is required and member ids are de-duplicated.
        For incremental add/remove of a single member, use POST/DELETE
        /api/v1/project-groups/{id}/members instead. Returns the updated group,
        404 if the id is unknown, or 400 on a blank name.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectGroupRequest" }
      responses:
        "200":
          description: The updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProjectGroup
      tags: [Projects]
      summary: Delete a project group
      description: >
        Removes the group. The member projects themselves are untouched. Idempotent:
        deleting an unknown id still returns 200.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }

  /api/v1/project-groups/{id}/members:
    post:
      operationId: addProjectGroupMember
      tags: [Projects]
      summary: Add a project to a group
      description: >
        Incrementally appends one project id to the group's membership
        (de-duplicated). Member ids need not resolve to registered projects.
        Returns the updated group. Prefer this over PUT for single-member edits;
        PUT remains the full-replace / bulk-set path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectGroupMemberRequest" }
      responses:
        "200":
          description: The updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeProjectGroupMember
      tags: [Projects]
      summary: Remove a project from a group
      description: >
        Incrementally drops one project id from the group's membership. Removing an
        absent member is a no-op and still returns 200 with the current group.
        Project ids may contain "/" or ":" so the id travels in the JSON body
        rather than as a path segment. Prefer this over PUT for single-member
        edits; PUT remains the full-replace / bulk-set path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProjectGroupMemberRequest" }
      responses:
        "200":
          description: The updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # Legacy project-scoped plan routes remain supported while clients migrate to
  # the flat Plan CRUD API below.
  /api/v1/projects/{project_id}/plans:
    get:
      operationId: ListProjectPlans
      tags: [Plans]
      summary: List legacy project plans
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PlanStatus" }
      responses:
        "200":
          description: The legacy project plan list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyPlanListResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: CreateProjectPlan
      tags: [Plans]
      summary: Create a legacy project plan record
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyCreatePlanRequest" }
      responses:
        "200":
          description: The created plan record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{project_id}/plans/scan:
    post:
      operationId: ScanProjectPlans
      tags: [Plans]
      deprecated: true
      summary: "[deprecated] Scan a project's plans directory"
      description: >
        Deprecated one-release migration aid. Prefer ImportLegacyPlans for
        explicit cutover into ScrivaDB. Never invoked automatically at daemon
        startup. After a Plan has been imported (or created DB-natively), scan
        cannot affect canonical definition, lifecycle, or execution — Status is
        not reseeded from directory placement for records with a non-empty
        definition.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyScanPlansRequest" }
      responses:
        "200":
          description: Scan result (includes deprecation notice)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyScanPlansResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{project_id}/plans/import-legacy:
    post:
      operationId: ImportLegacyPlans
      tags: [Plans]
      summary: Explicitly import legacy plans/*.yaml into ScrivaDB
      description: >
        Operator-invoked one-time cutover. Discovers plans/{pending,in_progress,
        completed,archived} (and flat plans/*.yaml) only when requested, parses
        supported v1 YAML, creates or reconciles canonical Plans by stable
        identity, and records a migration audit event. Repeated import with a
        matching content hash is a no-op (skipped) and cannot affect already-
        canonical execution; an existing canonical definition with a different
        hash is reported as conflicted without mutation. Source files are never
        modified. report_only=true classifies without writing. Never runs at
        daemon startup.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportLegacyPlansRequest" }
      responses:
        "200":
          description: Import report with imported/skipped/conflicted/errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportLegacyPlansResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{project_id}/plans/{plan_id}:
    get:
      operationId: GetProjectPlan
      tags: [Plans]
      summary: Get a legacy project plan
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/PlanId" }
      responses:
        "200":
          description: The plan record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyPlan" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: UpdateProjectPlan
      tags: [Plans]
      deprecated: true
      summary: "[deprecated] Update legacy plan execution fields"
      description: >
        Deprecated migration aid. Prefer run_plan / complete_plan / archive_plan
        for the PlanService state machine. Updates ScrivaDB fields only — does
        not move repository YAML and cannot redefine canonical task DAGs from
        disk.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/PlanId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyUpdatePlanRequest" }
      responses:
        "200":
          description: The updated plan record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: DeleteProjectPlan
      tags: [Plans]
      summary: Delete a legacy plan record
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/PlanId" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{project_id}/plans/{plan_id}/assess:
    post:
      operationId: AssessProjectPlan
      tags: [Plans]
      summary: Assess legacy plan progress
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/PlanId" }
      responses:
        "200":
          description: The assessed plan record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyPlan" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{project_id}/plans/{plan_id}/run:
    post:
      operationId: RunProjectPlan
      tags: [Plans]
      summary: Start legacy plan execution
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/PlanId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyRunPlanRequest" }
      responses:
        "200":
          description: The in-progress plan record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan cannot transition to in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans:
    get:
      operationId: ListPlans
      tags: [Plans]
      summary: List plans for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PlanStatus" }
          description: Filter by plan status; omit to return all plans.
      responses:
        "200":
          description: Plans matching the requested project and optional status filter
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: CreatePlan
      tags: [Plans]
      summary: Create a plan
      description: Creates the pending plan YAML file and its execution record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlanRequest" }
      responses:
        "201":
          description: The created pending plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/plans/export_backup:
    post:
      operationId: ExportPlanBackup
      tags: [Plans]
      summary: Export Plans into a portable backup bundle
      description: >
        Builds a versioned Plan backup bundle from ScrivaDB only (canonical
        definition, revision, execution history/summaries, events, notes, and
        integrity hashes). Excludes credentials and disposable worktrees.
        Never reads Git or repository replicas under plans/. Provide plan_ids
        and/or all=true (optionally scoped by project_id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportPlanBackupRequest" }
      responses:
        "200":
          description: Sealed Plan backup bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanBackupBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Plan store not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/restore_backup:
    post:
      operationId: RestorePlanBackup
      tags: [Plans]
      summary: Restore Plans from a portable backup bundle
      description: >
        Validates integrity hashes then restores Plans into ScrivaDB. Does not
        consult Git or repository replicas. Supports dry_run validation,
        stable-ID conflict policy (skip|fail|overwrite), and idempotent retry
        when identity + content hash + revision match.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestorePlanBackupRequest" }
      responses:
        "200":
          description: Per-entry restore result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanBackupRestoreResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Stable-ID conflict under on_conflict=fail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanBackupRestoreResult" }
        "503":
          description: Plan store not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/{plan_id}:
    get:
      operationId: GetPlan
      tags: [Plans]
      summary: Get a plan
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200":
          description: The plan, including its DB-backed task progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: UpdatePlan
      tags: [Plans]
      summary: Update a pending plan
      description: >
        Updates the canonical plan definition in ScrivaDB. Only pending plans are
        mutable; a plan that has started or finished returns 409. A stale
        expected_revision returns 409 with structured conflict fields.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlanRequest" }
      responses:
        "200":
          description: The updated plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan is not pending, or revision conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanMutationConflict" }

    delete:
      operationId: DeletePlan
      tags: [Plans]
      summary: Delete a plan
      description: >
        Permanently removes the plan record from ScrivaDB (never touches any
        YAML replica in the repository). A plan that is in_progress returns 409;
        archive or complete it first.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan is in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/{plan_id}/related:
    get:
      operationId: ListRelatedPlans
      tags: [Plans]
      summary: Heuristic related-plan / overlap query
      description: >
        Returns structured overlap candidates for a plan based on same project,
        title/name tokens, goal tokens, and linked branches/PRs. Hits are
        heuristic discovery aids only — not authoritative identity, conflict,
        or duplicate detection. Completed plans remain eligible for historical
        capability lookup. Discovery is ScrivaDB-only; repository YAML replicas
        never appear as additional plans.
      parameters:
        - { $ref: "#/components/parameters/PlanId" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: Maximum number of hits to return (default 10).
      responses:
        "200":
          description: Heuristic related-plan hits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelatedPlansResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/plans/{plan_id}/run:
    post:
      operationId: RunPlan
      tags: [Plans]
      summary: Start plan execution
      description: >
        Transitions a pending plan to in_progress and starts the selected execution
        mode. This is the only supported public start path for plan execution
        (including mode=autopilot).
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunPlanRequest" }
      responses:
        "200":
          description: The in-progress plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan cannot transition to in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/{plan_id}/restart:
    post:
      operationId: RestartPlan
      tags: [Plans]
      summary: Restart plan execution with a fresh set of agents
      description: >
        Work-preserving restart of an in_progress plan's executor. Captures a
        restart context, terminates the old manager and every run-tagged worker,
        removes their worktrees (keeping any task branch with commits beyond the
        integration branch and never closing PRs), resets unfinished tasks to
        pending, clears the heal ladder/backoff/needs-attention parking and spawns
        a new manager. Pipeline-mode plans are reopened instead: done jobs and
        handoffs are kept, other unfinished jobs are reset and re-run with fresh
        agents. orchestrator_worker and manual plans return 409. Without force, an active/starting/paused executor is
        refused. Idempotent: safe to re-issue after a partial failure.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestartPlanRequest" }
      responses:
        "200":
          description: The plan after the restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Wrong plan status, unsupported mode, healthy executor without force, or no executor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/{plan_id}/{action}:
    parameters:
      - { $ref: "#/components/parameters/PlanId" }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [pause, resume, stop] }
    post:
      operationId: ControlPlan
      tags: [Plans]
      summary: Pause, resume, or stop plan execution
      description: >
        Controls the active executor for an in-progress plan (autopilot, pipeline,
        or plan-bound agent). Together with POST /plans/{plan_id}/run and
        POST /plans/{plan_id}/restart, this is the public lifecycle surface for
        plan execution. Use restart (not resume) to bring a stopped, degraded,
        healing or parked executor back with a fresh agent set.
      responses:
        "200":
          description: The plan after the control action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Illegal lifecycle transition or no active executor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/{plan_id}/tasks:
    post:
      operationId: AddPlanTask
      tags: [Plans]
      summary: Add a task to a pending plan
      description: >
        Appends a task to the plan DAG. Only pending plans are mutable; a plan
        that has started or finished returns 409. Declared after dependencies
        must already exist, and the resulting DAG must be acyclic (400 on
        validation failure). A stale expected_revision returns 409 with
        structured conflict fields.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddPlanTaskRequest" }
      responses:
        "200":
          description: The plan with the new task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan is not pending, or revision conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanMutationConflict" }

  /api/v1/plans/{plan_id}/tasks/{task_id}/definition:
    patch:
      operationId: UpdatePlanTaskDefinition
      tags: [Plans]
      summary: Update a task definition on a pending plan
      description: >
        Patches prompt and/or after edges for one task. Only pending plans are
        mutable. Omitting a field leaves it unchanged; an empty prompt is
        rejected. Dependency and cycle validation failures return 400. A stale
        expected_revision returns 409 with structured conflict fields.
      parameters:
        - { $ref: "#/components/parameters/PlanId" }
        - { $ref: "#/components/parameters/TaskId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlanTaskDefinitionRequest" }
      responses:
        "200":
          description: The plan with the updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan is not pending, or revision conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanMutationConflict" }

  /api/v1/plans/{plan_id}/tasks/{task_id}:
    delete:
      operationId: DeletePlanTask
      tags: [Plans]
      summary: Remove a task from a pending plan
      description: >
        Deletes a task from the plan DAG. Only pending plans are mutable.
        Removal is rejected (400) when any remaining task still depends on the
        target. A stale expected_revision returns 409 with structured conflict
        fields.
      parameters:
        - { $ref: "#/components/parameters/PlanId" }
        - { $ref: "#/components/parameters/TaskId" }
        - name: expected_revision
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: "optimistic concurrency token; omit to use the revision observed at request start"
      responses:
        "200":
          description: The plan without the removed task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan is not pending, or revision conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanMutationConflict" }

  /api/v1/plans/{plan_id}/tasks/{task_id}/status:
    post:
      operationId: UpdateTaskStatus
      tags: [Plans]
      summary: Update task progress
      description: Updates only the plan's DB-backed task_progress map; the plan YAML is unchanged.
      parameters:
        - { $ref: "#/components/parameters/PlanId" }
        - { $ref: "#/components/parameters/TaskId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskStatusRequest" }
      responses:
        "200":
          description: The plan with updated task progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/plans/sync/push:
    post:
      operationId: PlanHubSync
      tags: [Plans]
      summary: Explicitly push a Plan Hub envelope
      description: >
        Operator-invoked Plan Hub transport.
        It never enables background replication. With the default local provider,
        discover returns an empty envelope list and makes no network calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: string }
                scope: { type: object }
                statuses: { type: array, items: { type: string, enum: [pending, in_progress, completed, archived] } }
      responses:
        "200":
          description: A pushed Plan or discovered/pulled envelope list
          content: { application/json: { schema: { type: object } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { description: Hub request failed }

  /api/v1/plans/sync/pull:
    post:
      operationId: PlanHubPull
      tags: [Plans]
      summary: Explicitly pull Plan Hub envelopes
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Envelope list, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { description: Hub request failed }

  /api/v1/plans/sync/discover:
    post:
      operationId: PlanHubDiscover
      tags: [Plans]
      summary: Discover pending and in-progress remote Plans
      description: Explicit, scoped team discovery; local/offline provider returns no envelopes.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Envelope list, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { description: Hub request failed }

  /api/v1/plans/{plan_id}/complete:
    post:
      operationId: CompletePlan
      tags: [Plans]
      summary: Complete a plan
      description: >
        Transitions an in-progress plan to completed. Every task must be done or
        skipped and every associated branch must be merged before completion.
        For autopilot plans, an integration branch with commits not on the
        default branch and no matching merged final PR is refused unless
        abandon_unmerged is set.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletePlanRequest" }
      responses:
        "200":
          description: The completed plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan cannot transition to completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Tasks are incomplete or associated branches remain unmerged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanCompletionError" }

  /api/v1/plans/{plan_id}/archive:
    post:
      operationId: ArchivePlan
      tags: [Plans]
      summary: Archive a plan
      description: >
        Pending and completed plans archive as a status change. An in_progress
        plan is refused with 409 while its executor is live (autopilot starting,
        active, paused, healing, degraded, finalizing or awaiting_merge; a
        cancelable pipeline; a live orchestrator agent) — stop it first. With a
        stopped or absent executor the plan's leftover agents, executor record
        and worktrees are torn down; branches with commits not on the default
        branch are kept. The status the plan was archived from is recorded so
        unarchive can restore it. The response carries `archive_report`.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200":
          description: The archived plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan is still running (live executor) or cannot be archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/{plan_id}/unarchive:
    post:
      operationId: UnarchivePlan
      tags: [Plans]
      summary: Unarchive a plan
      description: >
        Returns an archived plan to the status it was archived from and clears
        archived_at / archived_from. A plan archived before archived_from was
        recorded returns to completed when completed_at is set, otherwise
        pending. An in_progress plan comes back with a stopped or absent
        executor; nothing is started (`restart_plan` continues it).
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      responses:
        "200":
          description: The restored plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Plan is not archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/plans/{plan_id}/sync_to_repo:
    post:
      operationId: SyncPlanToRepo
      tags: [Plans]
      summary: Export a plan revision to a dedicated branch and open a PR
      description: >
        Loads the Plan only from ScrivaDB, renders the requested revision as an
        inert replica (YAML by default; JSON when `format=json`), commits it on a
        dedicated `warden/plan-sync/<plan-id>/<revision>` branch via an isolated
        git worktree, pushes without force, and opens or updates a PR against the
        requested base. Never mutates the operator's checked-out branch, stages
        unrelated changes, force-pushes, auto-merges, or overwrites a conflicting
        non-Warden file. When the same revision/content hash was already exported
        for the same repository/ref/path, returns the prior sync result with
        outcome=skipped and no new GitHub activity.
      parameters: [{ $ref: "#/components/parameters/PlanId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPlanToRepoRequest" }
      responses:
        "200":
          description: Sync result (including idempotent reuse)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanSyncToRepoResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Path collision or branch divergence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanSyncToRepoResult" }
        "503":
          description: Plan store / export store not configured, or GitHub auth unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/sessions/{id}/name:
    patch:
      operationId: setName
      tags: [Sessions]
      summary: Rename an agent
      description: A blank name clears it. Rejects an invalid format or a duplicate name.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: The new name (blank when cleared)
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/approve:
    post:
      operationId: approveSession
      tags: [Approvals]
      summary: Answer a recognized permission prompt
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                option: { type: integer, description: "1-based option to select" }
                fingerprint: { type: string, description: "Options fingerprint the UI rendered" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/events:
    post:
      operationId: ingestEvent
      tags: [Events]
      summary: Ingest a Claude hook event
      description: Sent by warden's hooks; appends an event and applies any status transition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "204":
          description: Unknown session (hooks fail soft)

  /api/v1/hooks/guard:
    post:
      operationId: guardHook
      tags: [Events]
      summary: Isolation guard verdict for a file-mutating tool call
      description: Backs the PreToolUse hook — decides whether an agent may Edit/Write a path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardRequest" }
      responses:
        "200":
          description: Allow/deny verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardVerdict" }

  /api/v1/tree:
    get:
      operationId: getTree
      tags: [Tree]
      summary: The full typed project hierarchy
      description: |
        Returns the daemon-computed project tree: projects (registered, loose-dir
        and the synthetic "No project" bucket) with their agents, terminals,
        pipelines and autopilot runs nested under one uniform envelope. The tree
        is derived from the same snapshots the daemon serves at /sessions,
        /projects, /pipelines and the autopilot status — clients render structure
        from this and join per-node detail via the session_id references against
        /sessions. A read route: ScopeReadOnly suffices.

        The identical Tree shape rides the /events/stream SSE feed as a named
        `tree` event (see that endpoint).
      parameters:
        - name: project_id
          in: query
          required: false
          schema: { type: string }
          description: >-
            Scope to a single project's subtree. An unknown project_id returns
            200 with empty roots (not 404 — the project may simply have nothing
            in it yet). Omitted returns every root, including the "No project"
            bucket.
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >-
            Include system sessions (tagged system:true) in the tree. Omitted or
            false hides them — mirrors /sessions and /events/stream exactly.
      responses:
        "200":
          description: The project hierarchy (a live snapshot; never cached)
          headers:
            Cache-Control:
              description: Always "no-store" — the tree is a live snapshot.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tree" }
        "503":
          description: >-
            The underlying session scan is degraded (complete-or-error, same
            contract as GET /sessions). Distinct from offline; the client shows
            "node degraded".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/events/stream:
    get:
      operationId: streamEvents
      tags: [Events]
      summary: Live session snapshot stream (SSE)
      description: |
        Server-Sent Events stream. Emits two independently-deduplicated frames:

        - the full sessions snapshot as the **unnamed** default event
          (`data: {"sessions":[...],"autopilot":{...}}`) — unchanged, so every
          existing client keeps working with zero changes; and
        - the full project tree (the same shape as GET /api/v1/tree) as a
          **named** `tree` event (`event: tree\ndata: {"roots":[...]}`).

        The two frames dedup separately: a pure status change re-sends only the
        sessions frame, a structural change re-sends only the tree frame. Old
        clients ignore the named `tree` event; new clients add one
        `addEventListener('tree', …)`. `?all=true` applies to both frames.
        Long-lived; not a request/response endpoint.
      responses:
        "200":
          description: text/event-stream of session + tree snapshots
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/pressure:
    get:
      operationId: getPressure
      tags: [Observability]
      summary: Memory-pressure + spawn-gate status
      responses:
        "200":
          description: Pressure status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PressureStatus" }

  /api/v1/metrics:
    get:
      operationId: getMetrics
      tags: [Observability]
      summary: Live resource snapshot
      responses:
        "200":
          description: A metrics sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsSample" }

  /api/v1/metrics/history:
    get:
      operationId: getMetricsHistory
      tags: [Observability]
      summary: Recorded metrics samples or per-agent summaries
      parameters:
        - name: since
          in: query
          description: RFC3339 lower bound
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer }
        - name: summary
          in: query
          description: When true, return per-agent summaries instead of raw samples
          schema: { type: boolean }
        - name: agent
          in: query
          description: Narrow summaries to one agent id (with summary=true)
          schema: { type: string }
      responses:
        "200":
          description: Samples (default) or summaries (summary=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items: { $ref: "#/components/schemas/MetricsSample" }
                  summaries:
                    type: array
                    items: { $ref: "#/components/schemas/AgentSummaryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/worktrees:
    get:
      operationId: listWorktrees
      tags: [Git]
      summary: List a repo's worktrees
      parameters:
        - name: repo
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Worktree listings
          content:
            application/json:
              schema:
                type: object
                required: [worktrees]
                properties:
                  worktrees:
                    type: array
                    items: { $ref: "#/components/schemas/WorktreeListing" }

  /api/v1/prune:
    post:
      operationId: pruneWorktrees
      tags: [Git]
      summary: Reclaim orphan worktrees
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PruneRequest" }
      responses:
        "200":
          description: Per-worktree prune results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/PruneResult" }

  /api/v1/recover:
    post:
      operationId: recoverAgents
      tags: [Sessions]
      summary: Revive archived orphaned agent records whose tmux session is still alive
      description: >-
        Scans archived (closed) records for ones whose status is `orphaned`
        (spec D8 — the only recovery source) and whose tmux_session is
        confirmed still alive (a tombstone can be wrongly reaped by a stale
        orphaned status racing a daemon restart — see the poller/reaper
        liveness reconfirm), and re-inserts each one's full original record
        into the active store under its original id. Non-orphaned archived
        records are never candidates. Because a child's parent_id is a
        one-way pointer, any children already reconnect with no edits of
        their own. apply=false (the default) only reports candidates;
        apply=true performs the recovery.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverRequest" }
      responses:
        "200":
          description: Recovery candidates and (if apply) their outcome
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/RecoverResult" }

  /api/v1/git/commit:
    post:
      operationId: gitCommit
      tags: [Git]
      summary: Stage + commit a worktree (rail-enforcing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitCommitRequest" }
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }

  /api/v1/git/push:
    post:
      operationId: gitPush
      tags: [Git]
      summary: Push a worktree's branch to origin (protected-branch refusal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitPushRequest" }
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }

  /api/v1/git/sync:
    post:
      operationId: gitSync
      tags: [Git]
      summary: Rebase a worktree's branch onto origin/base
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitSyncRequest" }
      responses:
        "200":
          description: Sync result (conflicts listed when rebase left in progress)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }

  /api/v1/check:
    post:
      operationId: runCheck
      tags: [Git]
      summary: Run the project's .warden/check.yml command(s)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckRequest" }
      responses:
        "200":
          description: Pass/fail summary (output only for failures)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }

  /api/v1/fs/dirs:
    get:
      operationId: listDirs
      tags: [Filesystem]
      summary: List immediate subdirectories
      parameters:
        - name: path
          in: query
          description: Directory to list (empty = the user's home directory)
          schema: { type: string }
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirListing" }

  /api/v1/fs/clone:
    post:
      operationId: cloneRepo
      tags: [Filesystem]
      summary: Clone a remote Git repository into the configured workspace directory
      description: >
        Backs the "Open remote project" TUI flow. Runs `git clone url` into
        <workspace_path>/<repo-name> (workspace_path is the workspace_path
        config setting, default ~/.warden/workspace), creating the workspace
        directory if needed. Fails if the destination already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloneRepoRequest" }
      responses:
        "200":
          description: Cloned directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloneRepoResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500":
          description: Clone execution failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/approvals:
    get:
      operationId: listApprovals
      tags: [Approvals]
      summary: Live approval queue
      responses:
        "200":
          description: Queue (enabled=false when the feature is off)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalsResponse" }

  /api/v1/auto-approve/policy:
    get:
      operationId: getAutoApprovePolicy
      tags: [Approvals]
      summary: Read the live auto-approve policy
      description: >
        The effective auto-approve policy the poller is running: the default
        allow/deny rules plus any per-agent overrides.
      responses:
        "200":
          description: The current policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoApprovePolicy" }
    put:
      operationId: setAutoApprovePolicy
      tags: [Approvals]
      summary: Replace the live auto-approve policy
      description: >
        Atomically swaps the policy the poller runs (effective immediately, no
        restart) and persists it to the config file's auto_approve block.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoApprovePolicy" }
      responses:
        "200":
          description: The stored policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoApprovePolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/known-prompts:
    get:
      operationId: listKnownPrompts
      tags: [Approvals]
      summary: List learned prompt shapes
      description: >
        The known-prompts store: prompt shapes the Fast-Brain has already read, so
        the next occurrence is recognized without a model call. Entries hold only
        templated shapes (never concrete commands or paths). Oldest first. An
        empty list when the feature is absent.
      responses:
        "200":
          description: Every stored entry
          content:
            application/json:
              schema:
                type: object
                required: [prompts]
                properties:
                  prompts:
                    type: array
                    items: { $ref: "#/components/schemas/KnownPrompt" }
    delete:
      operationId: forgetAllKnownPrompts
      tags: [Approvals]
      summary: Forget every learned prompt shape
      description: Empties the known-prompts store and audit-logs the action.
      responses:
        "200":
          description: Number of entries removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer }

  /api/v1/known-prompts/{id}:
    delete:
      operationId: forgetKnownPrompt
      tags: [Approvals]
      summary: Forget one learned prompt shape
      description: Removes one entry (the prompt is re-learned on its next appearance) and audit-logs the action.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/context:
    get:
      operationId: listContext
      tags: [Context]
      summary: List shared-context entries
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Entries under prefix
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/ContextEntry" }

  /api/v1/context/{key}:
    get:
      operationId: getContext
      tags: [Context]
      summary: Read a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setContext
      tags: [Context]
      summary: Write a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
                by: { type: string, description: "writer attribution" }
      responses:
        "200":
          description: The stored entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }
    delete:
      operationId: deleteContext
      tags: [Context]
      summary: Delete a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }

  /api/v1/context/{key}/cas:
    post:
      operationId: casContext
      tags: [Context]
      summary: Compare-and-swap a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected: { type: string, description: "'' = key must be absent" }
                value: { type: string }
                by: { type: string }
      responses:
        "200":
          description: The stored entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }
        "409":
          description: Current value did not match expected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/context/{key}/append:
    post:
      operationId: appendContext
      tags: [Context]
      summary: Atomically append to a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
                sep: { type: string, description: "separator inserted before value (skipped when creating)" }
                by: { type: string }
      responses:
        "200":
          description: The stored entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }

  /api/v1/sessions/{id}/messages:
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Send a directed message to an agent
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string }
                body: { type: string }
      responses:
        "201":
          description: Stored message + whether the recipient was woken
          content:
            application/json:
              schema:
                type: object
                required: [message, woke]
                properties:
                  message: { $ref: "#/components/schemas/Message" }
                  woke: { type: boolean }
    get:
      operationId: getInbox
      tags: [Messages]
      summary: Read an agent's inbox
      description: Returned messages are marked read.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - name: unread
          in: query
          description: Filter to unread only
          schema: { type: boolean }
      responses:
        "200":
          description: The inbox
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }

  /api/v1/sessions/{id}/messages/wait:
    get:
      operationId: waitForMessage
      tags: [Messages]
      summary: Long-poll for a message
      description: Blocks (server long-poll) until a message arrives or timeout elapses.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - name: timeout
          in: query
          description: Long-poll window in seconds
          schema: { type: integer }
        - name: from
          in: query
          description: Only wait for messages from this sender
          schema: { type: string }
      responses:
        "200":
          description: found=false on timeout
          content:
            application/json:
              schema:
                type: object
                required: [found]
                properties:
                  found: { type: boolean }
                  message:
                    nullable: true
                    x-go-type-skip-optional-pointer: false
                    allOf: [{ $ref: "#/components/schemas/Message" }]

  /api/v1/messages:
    get:
      operationId: listRecentMessages
      tags: [Messages]
      summary: Recent message traffic across all inboxes
      description: Read-only global view; never marks anything read.
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Recent messages, newest first
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }

  /api/v1/collab/conflicts:
    get:
      operationId: getConflicts
      tags: [Collaboration]
      summary: Current inter-agent file conflicts
      responses:
        "200":
          description: Files edited by two or more agents
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items: { $ref: "#/components/schemas/Conflict" }

  /api/v1/collab/branches:
    get:
      operationId: getBranchStatus
      tags: [Collaboration]
      summary: Per-agent CI + branch-vs-main status
      description: >
        Read-only snapshot, recomputed per request, of each tracked agent's
        branch: latest GitHub CI run and how it sits against origin/main
        (behind/ahead/merged). A disabled tracker returns an empty list.
      responses:
        "200":
          description: Branch status for every tracked agent with a branch
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items: { $ref: "#/components/schemas/BranchStatus" }

  /api/v1/pipelines:
    get:
      operationId: listPipelines
      tags: [Pipelines]
      summary: List pipelines
      parameters:
        - name: project_id
          in: query
          required: false
          description: Only pipelines belonging to this project id.
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: Only pipelines in one of these statuses (comma-separated).
          schema: { type: string }
      responses:
        "200":
          description: All pipelines
          content:
            application/json:
              schema:
                type: object
                required: [pipelines]
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
    post:
      operationId: createPipeline
      tags: [Pipelines]
      summary: Create a pipeline from a YAML spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spec: { type: string, description: "pipeline YAML" }
                project_id: { type: string, description: "id of the first-class project (projectstore) this pipeline joins. Overrides a project_id set in the YAML spec; when both are empty the daemon resolves it by matching the pipeline repo to an OPEN project (no match leaves the pipeline project-less). On create the pipeline is stamped with the resolved id and appended to the project's authoritative pipelines[] membership list." }
                plan_id:
                  type: string
                  description: >
                    optional back-ref to a planstore plan in the same project. Empty
                    is always valid (planless pipeline). A non-empty value must name
                    an existing plan whose ProjectID matches the resolved project
                    for this pipeline; otherwise the request is rejected with 400.
                    Does not change execution behavior — the plan-to-pipeline adapter
                    sets this when run_plan mode=pipeline creates the pipeline.
                parent_agent_id: { type: string, description: "id of the agent that owns this pipeline (project entity hierarchy D6). Overrides the identity of the agent behind the request; when both are empty the pipeline is operator-created and has no owning agent. On create the pipeline is stamped with the resolved id and appended to the owning agent's child_pipelines[] forward edge." }
      responses:
        "201":
          description: The parsed + stored pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/pipelines/{pid}:
    get:
      operationId: getPipeline
      tags: [Pipelines]
      summary: Show one pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200":
          description: The pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePipeline
      tags: [Pipelines]
      summary: Delete a pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused because a plan runs this pipeline (use the plan command named in the message) or the pipeline is in the wrong state for this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pipelines/{pid}/start:
    post:
      operationId: startPipeline
      tags: [Pipelines]
      summary: Start a pipeline (reconcile + spawn ready jobs)
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/pause:
    post:
      operationId: pausePipeline
      tags: [Pipelines]
      summary: Pause a pipeline (halt new spawns)
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused because a plan runs this pipeline (use the plan command named in the message) or the pipeline is in the wrong state for this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pipelines/{pid}/resume:
    post:
      operationId: resumePipeline
      tags: [Pipelines]
      summary: Resume a paused pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused because a plan runs this pipeline (use the plan command named in the message) or the pipeline is in the wrong state for this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pipelines/{pid}/cancel:
    post:
      operationId: cancelPipeline
      tags: [Pipelines]
      summary: Cancel a pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused because a plan runs this pipeline (use the plan command named in the message) or the pipeline is in the wrong state for this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pipelines/{pid}/jobs/{job}/emit:
    post:
      operationId: emitPipelineJob
      tags: [Pipelines]
      summary: Emit a job's output (commit work + fan out downstream)
      parameters:
        - { $ref: "#/components/parameters/PipelineId" }
        - { $ref: "#/components/parameters/JobId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/jobs/{job}/edit:
    post:
      operationId: editPipelineJob
      tags: [Pipelines]
      summary: Edit a pending job's prompt and/or handoff
      parameters:
        - { $ref: "#/components/parameters/PipelineId" }
        - { $ref: "#/components/parameters/JobId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string, x-go-type-skip-optional-pointer: false }
                handoff: { type: string, x-go-type-skip-optional-pointer: false }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/jobs/{job}/retry:
    post:
      operationId: retryPipelineJob
      tags: [Pipelines]
      summary: Retry a failed / needs-attention job
      parameters:
        - { $ref: "#/components/parameters/PipelineId" }
        - { $ref: "#/components/parameters/JobId" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/history:
    get:
      operationId: listHistory
      tags: [Observability]
      summary: Browse the archived (closed) session store
      parameters:
        - name: since
          in: query
          description: RFC3339 lower bound
          schema: { type: string, format: date-time }
        - name: role
          in: query
          description: Filter by built-in agent role (canonical)
          schema: { type: string }
        - name: type
          in: query
          deprecated: true
          description: >
            Deprecated alias for filtering by legacy task type. Prefer `role`.
            Accepted for one release; when both `role` and `type` are provided,
            `role` wins.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Archived sessions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/search:
    get:
      operationId: search
      tags: [Observability]
      summary: Full-text search across sessions
      parameters:
        - name: q
          in: query
          required: true
          description: Whitespace-separated terms (ANDed)
          schema: { type: string }
        - name: closed
          in: query
          description: Also search the archived store
          schema: { type: boolean }
      responses:
        "200":
          description: Matching sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "400":
          description: Blank query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/import:
    post:
      operationId: importSessions
      tags: [Import/Export]
      summary: Import session records from an export envelope
      description: Inserts records into the active store (metadata only; worktrees are not recreated).
      parameters:
        - name: merge
          in: query
          description: Overwrite on id collision instead of skipping
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Export" }
      responses:
        "200":
          description: Per-bucket import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }

  /api/v1/snapshots:
    post:
      operationId: createSnapshot
      tags: [Snapshots]
      summary: Capture a worktree + transcript snapshot
      description: Gated by the `snapshots` config setting; returns 403 when disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotCreateRequest" }
      responses:
        "200":
          description: The created snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "403":
          description: Snapshots disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listSnapshots
      tags: [Snapshots]
      summary: List snapshots
      parameters:
        - name: session
          in: query
          description: Filter to one session
          schema: { type: string }
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
        "403":
          description: Snapshots disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/snapshots/{id}/restore:
    post:
      operationId: restoreSnapshot
      tags: [Snapshots]
      summary: Restore a snapshot onto its recorded worktree
      description: Refuses a dirty tree unless force=true; never restores onto main/master.
      parameters: [{ $ref: "#/components/parameters/SnapshotId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResult" }
        "403":
          description: Snapshots disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/savings:
    get:
      operationId: getSavings
      tags: [Savings]
      summary: Aggregated token-savings summary
      description: >
        The measured token reductions warden's lifecycle features have earned
        (raw output kept out of agents' context), as a per-feature breakdown plus
        cumulative tokens, an estimated dollar figure, and the percentage of
        would-be context spend eliminated. Gated by the `savings` config setting;
        returns 403 when disabled.
      parameters:
        - name: since
          in: query
          description: Only count savings since this window (a Go duration like `168h`, or an RFC3339 timestamp). Absent ⇒ all time.
          schema: { type: string }
        - name: bucket
          in: query
          description: "Attach a zero-filled saved-tokens trend at this granularity: hour or day (an unknown value yields no trend)."
          schema: { type: string }
        - name: samples
          in: query
          description: Attach the retained provenance pairs (raw vs. kept samples).
          schema: { type: boolean }
      responses:
        "200":
          description: The savings summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsSummary" }
        "400":
          description: Invalid since value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Savings ledger disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/spend:
    get:
      operationId: getSpend
      tags: [Savings]
      summary: Per-agent / per-repo / per-day cost rollup
      description: >
        Cost governance: the REAL billed Claude spend warden measured from agents'
        transcripts, priced per model into dollars and rolled up per-agent,
        per-repo, and per-day, plus the daily/weekly totals the budget gate
        enforces. Gated by the `savings` config setting; returns 403 when disabled.
      responses:
        "200":
          description: The spend rollup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendReport" }
        "403":
          description: Savings/spend tracking disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot:
    get:
      operationId: getAutopilot
      tags: [Autopilot]
      summary: Autopilot status
      description: >
        Returns one entry per live
        Autopilot executor (run id, plan id, plan file, repo, state, gate, manager,
        workers, task rollup, backoff). Start and control plan execution via
        POST /plans/{plan_id}/run and POST /plans/{plan_id}/{action} instead of
        registering plan files.
      responses:
        "200":
          description: Autopilot status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotStatus" }

  /api/v1/autopilot/land:
    post:
      operationId: landAutopilot
      tags: [Autopilot]
      summary: Land a worker branch into the integration branch
      description: >
        The brain's only merge path (docs/specs/autopilot.md §6). Given an
        autopilot worker agent (id or name) or branch, it checks every
        precondition (owning run active, branch autopilot-owned, a PR based on
        the integration branch, the resolved gate green for the PR head SHA, and
        the PR mergeable), merges with the configured strategy, optionally
        deletes the worker branch, and records the landing authoritatively in the
        run ledger. Idempotent: re-issuing after a merge (or an already-recorded
        head SHA) returns already_landed with no second merge. On a precondition
        failure it returns 409 with a typed `kind`
        (gate_pending|gate_red|ci_missing|not_mergeable|not_found|not_owned|run_disabled|wrong_base)
        and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotLandRequest" }
      responses:
        "200":
          description: The landing result (already_landed=true on an idempotent re-issue)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotLandResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Autopilot is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A land precondition failed (typed kind, no side effects)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotLandError" }

  /api/v1/autopilot/complete:
    post:
      operationId: completeAutopilot
      tags: [Autopilot]
      summary: Mark the calling brain's run complete
      description: >
        The brain's completion signal (docs/specs/autopilot.md §2.1): once the
        brain has verified the plan's done_when criteria it declares its run
        complete. The daemon writes an in-place `status: complete` marker into the
        plan file (so preflight skips the plan on every future enable and it can
        never be executed again by mistake), tears the brain down gracefully
        (in-flight workers keep running), and retains the run ledger. Idempotent:
        a second call on an already-complete run is a no-op. The owning run is
        derived from the calling brain's own session identity, so no body is
        needed; only a run's own brain may complete it.
      responses:
        "200":
          description: The resulting autopilot status (the run now reports state=complete)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotStatus" }
        "403":
          description: The caller is not an autopilot brain with a run to complete
          content:
            application/json:
                schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot/tasks/status:
    post:
      operationId: updateAutopilotTaskStatus
      tags: [Autopilot]
      summary: Atomically update one plan task's durable status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotTaskStatusRequest" }
      responses:
        "200":
          description: The persisted task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotPlanTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Caller is not the owning autopilot brain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invalid transition or unverified landed PR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot/brain-consult:
    post:
      operationId: consultBrain
      tags: [Autopilot]
      summary: Consult a short-lived brain resolver (shared Consultor)
      description: >
        Autopilot-manager entry point for ad-hoc "unblock worker" / design
        decisions (docs/specs/2026-09-27-brain-consult.md §D5). Spawns a
        short-lived role=brain agent through the shared Consultor — same
        prompt contract, reply parse, defer-teardown, and audit.ActionBrainConsult
        trail as the PipelineWatcher path — then returns the closed action the
        brain chose. Does NOT touch the long-lived manager slot, Guardian heal
        ladder, or run ledger. The owning run is derived from the calling
        manager's session identity. Prefer this over spawn_agent with role=brain
        for unblock/design calls so teardown and audit stay shared.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrainConsultRequest" }
      responses:
        "200":
          description: The brain's closed action recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrainConsultResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Caller is not the owning autopilot manager, or brain consult is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Brain produced no parseable reply before the consult timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/schedules:
    get:
      operationId: listSchedules
      tags: [Schedules]
      summary: List schedules
      description: Gated by the `scheduler_enabled` config setting; returns 403 when disabled.
      responses:
        "200":
          description: All schedules
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createSchedule
      tags: [Schedules]
      summary: Create a recurring (cron) or single-shot (at) schedule
      description: >
        Fires either an agent spawn (type/repo/prompt/agent/branch) or a pipeline
        (spec). Provide exactly one of cron/at/now and exactly one fire mode. An `at`
        time that is not after the current time is rejected with 400; use `now`
        to fire once immediately. Gated by the `scheduler_enabled` config
        setting; returns 403 when disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCreateRequest" }
      responses:
        "201":
          description: The created schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/schedules/{id}:
    get:
      operationId: getSchedule
      tags: [Schedules]
      summary: Get one schedule by id
      description: Gated by the `scheduler_enabled` config setting; returns 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSchedule
      tags: [Schedules]
      summary: Edit a schedule in place
      description: >
        Changes a schedule's timing or fire payload while keeping its id, created
        time and last-run history. Only the fields present in the body change; an
        empty string clears an optional field. Changing timing recomputes next_run;
        switching between cron and at is allowed; a past `at` is rejected. Switching
        between agent and pipeline mode is rejected (create a new schedule). The
        result is validated like a create, so an edit cannot produce a schedule that
        could never fire. Gated by `scheduler_enabled`; 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpdateRequest" }
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSchedule
      tags: [Schedules]
      summary: Delete a schedule
      description: Gated by the `scheduler_enabled` config setting; returns 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schedules/{id}/enable:
    post:
      operationId: enableSchedule
      tags: [Schedules]
      summary: Enable a schedule
      description: >
        Re-arms a disabled schedule: recomputes next_run from now (cron → next
        occurrence; at → its configured time, which fires on the next tick if
        already past). Idempotent. Gated by `scheduler_enabled`; 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schedules/{id}/disable:
    post:
      operationId: disableSchedule
      tags: [Schedules]
      summary: Disable a schedule
      description: >
        Stops a schedule from firing: clears next_run and leaves it inactive until
        re-enabled. The record and its last-run history are preserved. Idempotent.
        Gated by `scheduler_enabled`; 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schedules/{id}/run:
    post:
      operationId: runSchedule
      tags: [Schedules]
      summary: Fire a schedule once, now
      description: >
        Fires the schedule immediately, exactly as the scheduler would (same spawn
        or pipeline start, same schedule back-reference, same last-run recording),
        without changing its next run, its enabled state or whether a single-shot
        is still pending. Works on a disabled schedule. A fire failure is returned
        as an error and also recorded in the schedule's last_error. Gated by
        `scheduler_enabled`; 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200":
          description: The schedule and the run this fire produced
          content:
            application/json:
              schema:
                type: object
                required: [schedule, run_id]
                properties:
                  schedule: { $ref: "#/components/schemas/Schedule" }
                  run_id: { type: string, description: "id of the agent (agent mode) or pipeline (pipeline mode) that was started" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The fire failed; the reason is also recorded in last_error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token. Required on every request (including loopback) when the
        daemon is configured with a token / for non-loopback access. SSE and
        WebSocket clients may pass it as a `?token=` query parameter.

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Session id or name
      schema: { type: string }
    CtxKey:
      name: key
      in: path
      required: true
      description: Dot-namespaced context key (no '/' or '\\')
      schema: { type: string }
    PipelineId:
      name: pid
      in: path
      required: true
      schema: { type: string }
    PlanId:
      name: plan_id
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: job
      in: path
      required: true
      schema: { type: string }
    SnapshotId:
      name: id
      in: path
      required: true
      description: Snapshot id (snap-<8hex>)
      schema: { type: string }
    ScheduleId:
      name: id
      in: path
      required: true
      description: Schedule id (== its name)
      schema: { type: string }

  responses:
    OK:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: ok }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    SavingsFeature:
      type: object
      description: Rolled-up token saving for one lifecycle feature.
      properties:
        feature: { type: string, example: check }
        events: { type: integer }
        raw_tokens: { type: integer, description: Counterfactual tokens (what would have entered context) }
        kept_tokens: { type: integer, description: Tokens that actually entered context }
        saved_tokens: { type: integer }
        saved_dollars: { type: number, format: double }

    SavingsSummary:
      x-go-type: savings.Summary
      x-go-type-import:
        path: github.com/srjn45/warden/internal/savings
        name: savings
      type: object
      description: Aggregated token savings over the requested window.
      properties:
        since: { type: string, format: date-time }
        events: { type: integer }
        raw_tokens: { type: integer }
        kept_tokens: { type: integer }
        saved_tokens: { type: integer }
        saved_dollars: { type: number, format: double }
        reduction_pct:
          type: number
          format: double
          description: saved ÷ (saved + kept), as a percentage
        features:
          type: array
          items: { $ref: "#/components/schemas/SavingsFeature" }

    SpendBucket:
      x-go-type: spend.Bucket
      x-go-type-import:
        path: github.com/srjn45/warden/internal/spend
        name: spend
      type: object
      description: One cost rollup row — an agent, repo, or day — with priced spend.
      properties:
        key: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        usd: { type: number, format: double }
      required: [key, input_tokens, output_tokens, usd]

    SpendReport:
      x-go-type: spend.Report
      x-go-type-import:
        path: github.com/srjn45/warden/internal/spend
        name: spend
      type: object
      description: Measured Claude spend, priced per model and rolled up three ways.
      properties:
        total_usd: { type: number, format: double }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        by_agent: { type: array, items: { $ref: "#/components/schemas/SpendBucket" } }
        by_repo: { type: array, items: { $ref: "#/components/schemas/SpendBucket" } }
        by_day: { type: array, items: { $ref: "#/components/schemas/SpendBucket" } }
        daily_usd: { type: number, format: double }
        weekly_usd: { type: number, format: double }
      required: [total_usd, input_tokens, output_tokens, daily_usd, weekly_usd]

    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    CapabilitiesResponse:
      type: object
      required: [capabilities]
      description: The optional capability flags this daemon supports (feature detection).
      properties:
        capabilities:
          type: array
          items: { type: string }
          description: >
            Stable capability-flag strings. Known flags: "terminal-sessions"
            (session `kind` support — see GET /api/v1/capabilities), "store-health"
            (the GET /api/v1/store/health endpoint + complete-or-error active
            reads / 503 on degradation), "backend-recovery" (the session
            `backend_recovery` field is present and SSE fires on recovery phase
            changes — reactive hard-limit provider switching is active).

    StoreScanFailure:
      type: object
      required: [collection, class, detail]
      description: One record (or whole-scan) failure encountered reading the store.
      properties:
        collection:
          type: string
          description: 'The store collection the failure is in (e.g. "active").'
        key:
          type: string
          description: >
            The session id of the unreadable record, when the engine surfaced it;
            empty for a whole-scan (segment/checksum) failure that aborted before
            any record could be examined.
        class:
          type: string
          enum: [decode, read, integrity]
          description: >
            Failure class: "decode" = the record's stored payload would not decode
            into a session (shape-invalid); "read" = the underlying segment scan
            itself failed (framing, checksum, or index read); "integrity" = the
            engine returned data contradicting its index (identity mismatch,
            duplicate key, or a record silently omitted from a scan).
        detail:
          type: string
          description: Human-readable failure detail.

    StoreHealth:
      type: object
      required: [healthy, degraded, failure_count, failures, checked_at, repair_available, next_step]
      description: >
        Health verdict for the active session store. `healthy` is the top-line
        boolean; `degraded` is its inverse, provided for readability. When
        degraded, `failures` carries structured per-record diagnostics.
      properties:
        healthy:
          type: boolean
          description: True when the active fleet can be read completely.
        degraded:
          type: boolean
          description: True when one or more active records cannot be read (inverse of healthy).
        failure_count:
          type: integer
          description: Number of unreadable records (or 1 for a whole-scan failure).
        failures:
          type: array
          items: { $ref: "#/components/schemas/StoreScanFailure" }
          description: Per-failure diagnostics; empty when healthy.
        checked_at:
          type: string
          format: date-time
          description: When this health check ran (server time, UTC).
        repair_available:
          type: boolean
          description: >
            Whether warden can rebuild a corrupt agent store. False until the
            ScrivaDB Verify/Repair primitives exist upstream; clients must not
            offer a repair action while false.
        next_step:
          type: string
          description: >
            Safe operator guidance (daemon-offline procedure). Never suggests
            deleting files; running agents are unaffected by a degraded store.

    Status:
      type: string
      description: Agent lifecycle status
      enum: [spawning, working, waiting_for_input, idle, done, errored, orphaned, rate_limited]

    TaskType:
      type: string
      deprecated: true
      description: >
        Deprecated legacy agent task type. Prefer Session/SpawnRequest `role`
        (with optional `task` for tier routing). Kept for one-release
        compatibility; new clients must not set this as classification.
      enum: [development, analysis, spike, pr-review, code, docs, website, debug-ci, tests, other]

    Event:
      x-go-type: store.Event
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      properties:
        ts: { type: string, format: date-time }
        type: { type: string }
        detail: { type: string }

    BackendCandidate:
      x-go-type: store.BackendCandidate
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: >
        Identifies one provider capacity pool by (backend_id, model_id). Model is
        part of the identity because providers may meter independent model pools
        separately — two models on the same backend can have unrelated limits.
      properties:
        backend_id: { type: string, description: "Agent backend identifier (e.g. claude, codex)." }
        model_id: { type: string, description: "Model identifier within that backend." }
      required: [backend_id, model_id]

    RecoveryAttempt:
      x-go-type: store.RecoveryAttempt
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: One attempt to switch to a candidate during reactive hard-limit recovery.
      properties:
        candidate: { $ref: "#/components/schemas/BackendCandidate" }
        round:
          type: integer
          format: uint64
          description: >
            Recovery round index. 0 = first attempt; increments after each
            waiting_for_capacity → retry cycle.
        started_at: { type: string, format: date-time }
        outcome:
          type: string
          description: >
            "hard_limit" = original pool confirmed limited at recovery start;
            "immediate_hard_limit" = candidate hit a limit right after switching;
            "launch_failed" = process or handoff launch failed;
            "stabilized" = successfully stabilized (recovery complete);
            "superseded" = invalidated by a manual switch/stop/delete.
      required: [candidate, round, started_at, outcome]

    RecoveryReset:
      x-go-type: store.RecoveryReset
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: >
        Known reset window for a limited backend/model pool, as reported by the
        provider via the backend-usage service. resets_at is null when the provider
        supplied no reset time; never coerce null to zero or any synthetic value —
        render as "unknown".
      properties:
        backend_id: { type: string }
        limit_id: { type: string, description: "Provider-assigned limit identifier (stable key)." }
        scope: { type: string, description: "Stable scope key for display. Never use as a locator." }
        resets_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When this limit resets, in UTC. Null means the provider gave no reset
            time. Never coerce null to zero, a past time, or "full"; render as "unknown".
      required: [backend_id, limit_id, scope]

    BackendRecovery:
      x-go-type: store.BackendRecovery
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: >
        Reactive hard-limit recovery state. Non-null on a session while the
        coordinator is automatically switching to a new provider after a confirmed
        hard usage limit. Null means no recovery is active.

        Phase strings (§8 of the reactive-backend-limit-recovery spec):
          "refreshing_usage"    → UI: "recovering: refreshing usage"
          "switching"           → UI: "recovering: trying <backend>/<model> (n/m)"
          "stabilizing"         → UI: "recovering: stabilizing <backend>/<model>"
          "waiting_for_capacity"→ UI: "waiting for capacity; retry <time|fallback>; attempted n"
        A superseded recovery is cleared and the session carries no BackendRecovery.

        PRIVACY: this field never exposes provider credentials, account or email
        identifiers, raw CLI/provider output, terminal banners, prompts, or
        transcript content. Unknown usage/resets render as "unknown" — never as
        zero or "full". Exact percentages are omitted from remote API surfaces.

        SSE notifications (GET /api/v1/events) fire on phase changes; subscribe
        there for live updates without polling. The "backend-recovery" capability
        flag (GET /api/v1/capabilities) signals that this field is supported.
      properties:
        generation:
          type: integer
          format: uint64
          description: >
            Monotonic generation counter. Increments each time a new recovery
            starts. Generation-checked callbacks ensure stale timers and late
            poll events cannot overwrite a newer manual action.
        round:
          type: integer
          format: uint64
          description: >
            Retry round index. 0 = first sequential attempt; increments after each
            waiting_for_capacity → retry refresh cycle.
        phase:
          type: string
          enum: [refreshing_usage, switching, stabilizing, waiting_for_capacity]
          description: >
            Current recovery phase. See schema description for UI string mapping.
        original:
          $ref: "#/components/schemas/BackendCandidate"
          description: The backend/model pool that hit the confirmed hard limit.
        current:
          allOf:
            - $ref: "#/components/schemas/BackendCandidate"
          nullable: true
          description: >
            Backend/model currently being tried or in stabilization. Null when
            no candidate has been selected yet or between sequential attempts.
        attempts:
          type: array
          items: { $ref: "#/components/schemas/RecoveryAttempt" }
          description: >
            Ordered history of all candidate attempts in the current generation.
            Use len(attempts) for "attempted n" in status display.
        resets:
          type: array
          items: { $ref: "#/components/schemas/RecoveryReset" }
          description: >
            Known reset windows for exhausted pools, used to schedule the next
            retry. May be empty when no provider supplied reset times.
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Earliest time the coordinator will retry after waiting_for_capacity.
            Null when not in the waiting phase or no retry is scheduled.
            Never coerce null to zero or a synthetic time.
        stable_since:
          type: string
          format: date-time
          nullable: true
          description: >
            Start of the stabilization observation window. Null until the first
            live non-rate-limited poll arrives after a candidate switch. For
            display only; cleared on recovery completion.
        trigger_source:
          type: string
          enum: [usage, menu, banner, manual]
          description: >
            Why this recovery generation started. usage = fresh provider usage
            API exhaustion; menu = confirmed Claude wait-for-reset menu;
            banner = confirmed hard-limit pane wording; manual = operator
            recover command. Safe for display; never carries pane text.
        capacity_domain:
          type: string
          description: >
            Safe capacity-domain display key (provider[/fingerprint[/route]]).
            Opaque account fingerprints only — never raw credentials or emails.
        bucket_key:
          type: string
          description: >
            Opaque provider bucket key that drove recovery, when known.
        freshness:
          type: string
          enum: [fresh, stale, unknown]
          description: >
            Usage-snapshot freshness at trigger time. Failed/stale/unknown
            fetches never force exhaustion; this field explains why a swap did
            or did not occur alongside the audit trail.
        reason:
          type: string
          description: >
            Short redacted operator-facing explanation (e.g. mandatory_bucket_exhausted,
            no_eligible_candidate). Never pane text, tokens, or credentials.
        updated_at:
          type: string
          format: date-time
          description: When this recovery record was last written (UTC).
      required: [generation, round, phase, original, attempts, updated_at]

    Session:
      x-go-type: store.Session
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      properties:
        id:
          type: string
          description: >
            opaque, kind-agnostic session token. Not a kind hint — ids may use
            the `agent-` prefix, `guardian-*`, `<pipeline>-<job>`, or plan-scoped
            autopilot slot forms. Never parse kind (or anything else) from the id;
            classify with the `kind` field.
        name:
          type: string
          description: >
            optional human-friendly alias. Omitted from the JSON when unset
            (encoded with `omitempty`), so an absent key decodes as null/empty —
            terminals and un-named agents carry no name. Treat as optional and
            never derive identity or kind from it.
        type:
          allOf:
            - { $ref: "#/components/schemas/TaskType" }
          deprecated: true
          description: >
            Deprecated legacy agent classification. Prefer `role`. Accepted and
            dual-emitted for one release; when both `role` and `type` are present
            on input, `role` wins. Empty/`other` means free-form (no typed worktree).
        ticket: { type: string }
        tmux_session: { type: string }
        ai_cli:
          type: string
          description: >
            AI CLI that drives this agent (claude, aider, …). Empty means the
            daemon default (typically claude). Canonical name; preferred over
            the deprecated `backend` alias.
        backend:
          type: string
          deprecated: true
          description: >
            Deprecated alias for `ai_cli`. Accepted on input for one release;
            responses dual-emit both keys during the alias window. When both
            `ai_cli` and `backend` are present, `ai_cli` wins.
        ai_cli_session_id:
          type: string
          description: >
            Pinned AI CLI resume conversation id (UUID/token). Canonical name;
            preferred over the deprecated `claude_session_id` alias.
        claude_session_id:
          type: string
          deprecated: true
          description: >
            Deprecated alias for `ai_cli_session_id`. Accepted on input for one
            release; responses dual-emit both keys during the alias window.
            When both are present, `ai_cli_session_id` wins.
        repo: { type: string }
        worktree: { type: string }
        branch: { type: string }
        worktree_created: { type: boolean }
        branch_created: { type: boolean }
        pr: { type: string }
        prompt: { type: string }
        workdir: { type: string }
        subject: { type: string }
        activity: { type: string, description: "live 3-5 word status badge, refreshed by the poller while the pane is changing (activity.interval); distinct from the one-line subject" }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/Status" }
        kind:
          type: string
          enum: [agent, terminal]
          description: >
            session kind. Absent or empty means "agent" (back-compat: records that
            predate the field, and every AI agent, read as agents). "terminal" is a
            plain shell, excluded from AI-centric surfaces. Present on EVERY session
            row so a client can classify without heuristics.
        pid: { type: integer }
        exit_code: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        last_pane_excerpt: { type: string }
        auto_restart: { type: boolean }
        restart_count: { type: integer }
        permission_mode: { type: string }
        auto_approve: { type: boolean }
        role:
          type: string
          description: >
            Built-in agent role name (canonical classification). Empty = general
            (no persona). Preferred over the deprecated `type` field.
        task: { type: string, description: "assigned task dimension from the registry" }
        pipeline_id: { type: string }
        job_id: { type: string }
        schedule_id:
          type: string
          description: >
            back-ref to the schedule that fired this run. Set on schedule-spawned
            sessions — agent-mode fires directly, and pipeline-mode job sessions
            inherit it from the scheduled pipeline. Absent (omitempty) on normal
            operator/CLI/API spawns. Present the same way in GET /sessions,
            GET /sessions/{id}, and the SSE event stream, so a client can tag a
            running session as schedule-origin and keep it out of the plain agents
            list by filtering this one field.
        plan_id:
          type: string
          description: >
            back-ref to the plan that spawned this session (orchestrator_worker or
            manual plan-run modes, and pipeline jobs stamped from a plan-owned
            pipeline). Absent (omitempty) on ordinary operator/CLI/API spawns.
        schedule_name:
          type: string
          description: >
            operator-facing name of that schedule (== schedule_id today), carried
            for display so a client need not re-fetch the schedule. Absent when
            schedule_id is.
        seed_status:
          type: string
          enum: [pending, delivered, failed]
          description: >
            outcome of the post-launch initial-prompt seed for typed-prompt
            backends (crush/goose/aider), whose first task is pasted into the pane
            rather than passed on the launch line. `failed` means every retry
            failed: the agent idles at an empty composer and the prompt is saved at
            `<prompts dir>/<id>`. Absent for launch-line backends and agents spawned
            without a prompt.
        seed_error:
          type: string
          description: last seed failure text; present only with seed_status=failed.
        autopilot_run_id:
          type: string
          description: >
            back-ref to the owning autopilot run id (`ap-…`). Set on manager,
            guardian, and worker sessions in the plan-scoped hierarchy. Absent
            (omitempty) on non-autopilot sessions and legacy records.
        autopilot_slot:
          type: string
          enum: [autopilot, guardian, worker]
          description: >
            which slot in the plan-scoped tree this session occupies. Absent on
            non-autopilot sessions.
        autopilot_task_id:
          type: string
          description: >
            plan task id for worker sessions. Absent on manager/guardian slots and
            non-autopilot sessions.
        model: { type: string }
        parent_id:
          type: string
          description: >
            back-ref to the user-facing agent (GET /api/v1/sessions) that
            spawned this agent; empty/absent = a root agent created by an
            operator. Its forward edge is the parent's child_agents[] list.
            Pipeline job agents use pipeline_id/job_id instead and terminals
            are never parented this way. Present the same way across GET
            /sessions, GET /sessions/{id}, and the SSE stream.
        child_agents:
          type: array
          items: { type: string }
          description: >
            forward edge of `parent_id` (project entity hierarchy D3): the ids of
            the user-facing sub-agents this agent spawned. Maintained on both ends
            in the same operation — a spawn with a `parent_id` appends the child
            here and delete/archive removes it. Holds ONLY user-facing spawned
            agents: pipeline job agents (reached via the owning pipeline) and
            terminals are excluded. Dangling ids are tolerated (a child that is
            orphaned/hibernated is not eagerly pruned). Absent/empty for a leaf
            agent. Present the same way across GET /sessions, GET /sessions/{id},
            and the SSE stream.
        child_pipelines:
          type: array
          items: { type: string }
          description: >
            forward edge of `Pipeline.parent_agent_id` (project entity hierarchy
            D4): the ids of the pipelines this agent owns — created or escalated by
            it. Maintained on both ends in the same operation — a pipeline created
            under this agent appends its id here and pipeline delete removes it. A
            nested pipeline appears in both directions. A pipeline's own job agents
            are NOT listed here (D5): they are reached through the pipeline
            (child_pipelines[] -> Pipeline.jobs), never as child_agents. Dangling
            ids are tolerated (an owned pipeline that is orphaned/hibernated is not
            eagerly pruned). Absent/empty for an agent that owns no pipelines.
            Present the same way across GET /sessions, GET /sessions/{id}, and the
            SSE stream.
        child_autopilots:
          type: array
          items: { type: string }
          description: >
            forward edge of `Autopilot.parent_agent_id`: the ids of live Autopilot
            runs this agent parents. Maintained on both ends when an Autopilot is
            created under an agent. Dangling ids are tolerated. Absent/empty for an
            agent that parents no Autopilot runs. Present the same way across GET
            /sessions, GET /sessions/{id}, and the SSE stream.
        project_id:
          type: string
          description: >
            back-ref to the first-class project (GET /api/v1/projects) this agent
            belongs to; empty/absent = ungrouped. It is the PARENT project's id: an
            agent in a git worktree links to its repo's project here and carries its
            own worktree path in `worktree` — a worktree is never a project of its
            own. Present the same way across GET /sessions, GET /sessions/{id}, and
            the SSE stream so a client can group agents by project.
        context_tokens: { type: integer }
        context_state: { type: string, enum: ["", ok, warning, critical] }
        backend_recovery:
          allOf:
            - $ref: "#/components/schemas/BackendRecovery"
          nullable: true
          description: >
            Reactive hard-limit recovery state. Null when no automatic recovery
            is active. Non-null while the coordinator is refreshing usage,
            trying a candidate (switching), stabilizing, or waiting for capacity
            after all candidates were exhausted.
            SSE (GET /api/v1/events) fires on phase transitions — subscribe there
            rather than polling. Requires the "backend-recovery" capability flag.
      required: [id, status, created_at, updated_at]

