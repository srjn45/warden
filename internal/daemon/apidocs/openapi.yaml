            Special executor values `span-out` / `span-in` are not role aliases.
        run_if: { type: string, enum: [success, failure, always] }
        agent_id: { type: string, description: "id of the agent executing this job (project entity hierarchy D5). Supersedes session_id; both are written during the transition so older clients remain compatible." }
        session_id: { type: string, description: "Deprecated: use agent_id. Kept for backward compatibility during the agent-id migration; mirrors agent_id on write." }
        status: { type: string }
        output: { type: string }
        branch: { type: string }
        digest: { $ref: "#/components/schemas/Digest" }
        synthetic:
          type: boolean
          description: >-
            True for jobs warden injects itself (the span-out / span-in fan-out
            and join jobs) rather than ones the spec author wrote. They stay in
            `jobs` for the executor and UIs but cannot be edited or retried and
            are excluded from `job_count` / `jobs_done`.

