      description: >-
        Configuration for mid-session context handover. context_fill_threshold is the
        only active trigger; threshold_percent and rolling_quota_threshold are deprecated
        and have no effect — confirmed hard-limit recovery (via the backend recovery
        coordinator) now owns all provider-quota switching. These deprecated fields are
