        tags: { type: array, items: { type: string } }
        parent_id: { type: string, description: "id of the agent that spawned this one; empty = root" }
        project_id: { type: string, description: "id of the first-class project (projectstore) this agent/terminal joins. Empty = resolve by matching the launch path (cwd/repo) to an OPEN project; no match leaves the session project-less. On spawn the session is stamped with the resolved id and appended to the project's authoritative agents[]/terminals[] membership list." }
        plan_id:
          type: string
          description: >
            optional back-ref to a planstore plan in the same project. Empty is
            always valid (planless agent). A non-empty value must name an existing
            plan whose ProjectID matches the resolved project for this spawn;
            otherwise the request is rejected with 400. Does not change execution
            behavior — adapters that drive plan-bound runs set this later.
        role:
