      required: [enabled, threshold_percent, rolling_quota_threshold, context_fill_threshold, cooldown_period]
      properties:
        enabled: { type: boolean }
        threshold_percent:
          type: integer
          deprecated: true
          description: >-
            Deprecated; has no effect. Provider quota switching is triggered only by
            confirmed hard limits via the backend recovery coordinator.
            Use rate_limit.recovery.enabled to control recovery behaviour.
        rolling_quota_threshold:
          type: integer
          deprecated: true
          description: >-
            Deprecated; has no effect. Provider quota switching is triggered only by
            confirmed hard limits via the backend recovery coordinator.
            Use rate_limit.recovery.enabled to control recovery behaviour.
        context_fill_threshold:
          type: integer
          description: >-
            Context-window fill percentage (0–100) at which a mid-session handover is
            triggered. This is the only active threshold; it controls context-fill
            detection only and has no role in provider-quota switching.
        cooldown_period: { type: integer, description: "cooldown period in nanoseconds" }

