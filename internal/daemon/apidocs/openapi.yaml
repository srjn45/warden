        without a second lookup. Never embeds a full session. Every field is
        omitempty.
      properties:
        kind: { type: string, description: "session kind: agent | terminal (session-backed nodes)" }
        ai_cli: { type: string, description: "agent nodes: AI CLI id, for an icon before session detail arrives" }
        backend:
          type: string
          deprecated: true
          description: "Deprecated alias for `ai_cli`. Dual-emitted during the alias window."
        depends_on:
          type: array
          items: { type: string }
          description: "job nodes: the DAG edges"
        repo: { type: string, description: "project/pipeline/run nodes: resolved repo path" }
        path: { type: string, description: "project nodes: local checkout path" }
        slot: { type: string, description: "autopilot lane: autopilot | guardian | worker" }
        gate: { type: string, description: "autopilot_run nodes: gate mode" }
        plan_id:
          type: string
          description: >
            agent/pipeline/plan/autopilot nodes: optional back-ref to the
            planstore plan this node is linked to. Omitted when planless.
        section:
          type: string
          description: "section nodes: plans | autopilots | pipelines | agents | terminals"
        synthetic: { type: boolean, description: "true for the \"No project\" bucket" }
        degraded: { type: boolean, description: "subtree degraded in place" }
        closed: { type: boolean, description: "true for a node under a closed/hibernated project" }
        revision:
          type: integer
          format: int64
          description: "plan nodes: canonical optimistic-concurrency revision"
        executor_id:
          type: string
          description: "plan nodes: live or linked executor id"
        task_summary:
          type: string
          description: "plan nodes: compact done/total task rollup (e.g. 2/5)"
        export_status:
          type: string
          description: "plan nodes: none|current|stale relative to last repository export"
        updated_at:
          type: string
          format: date-time
          description: "plan nodes: last canonical update timestamp"

