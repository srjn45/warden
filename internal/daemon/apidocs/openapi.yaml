        kind:
          type: string
          enum: [agent, terminal]
          description: >
            session kind. Empty or "agent" (the default) creates an AI agent with
            the chosen AI CLI. "terminal" creates a plain interactive shell
            (${SHELL:-bash}) in `cwd` — NOT an AI agent: `ai_cli`/`backend`, `model`,
