openapi: 3.0.3
info:
  title: warden daemon API
  version: "1.0.0"
  description: |
    REST API for the **warden** daemon — the long-running process that spawns,
    supervises, and coordinates Claude Code agent sessions.

    ## Authentication

    Every data- and action-bearing route is gated by a **bearer token**
    (`Authorization: Bearer <token>`) whenever the daemon is configured for
    non-loopback access (a token is set, or `WARDEN_TOKEN` is exported). In the
    default loopback-only mode no token is set and authentication is disabled, so
    the header is ignored. SSE/WebSocket clients that cannot set headers may pass
    the token as a `?token=` query parameter instead.

    The liveness probe (`/healthz`) and the documentation surface (`/api/docs`,
    `/api/docs/openapi.yaml`) are **public** — like the static SPA shell — so a
    proxy/tunnel health check and the docs UI load without a token.

    ## Source of truth

    This document is derived directly from the routes registered in
    `internal/daemon` (`server.go` + the `register*Routes` helpers). A drift-guard
    test (`apidocs_routes_test.go`) asserts every concrete route in the daemon's
    chi mux has a matching path here, and vice versa.
servers:
  - url: http://127.0.0.1:8765
    description: Default loopback bind (no auth)
  - url: /
    description: Same-origin (relative)
tags:
  - name: Documentation
    description: OpenAPI spec + interactive docs (public)
  - name: Health
    description: Liveness
  - name: Sessions
    description: Agent session lifecycle and inspection
  - name: Events
    description: Hook events and the live SSE stream
  - name: Git
    description: Rail-enforcing git lifecycle (commit/push/sync/check) and worktrees
  - name: Approvals
    description: Permission-prompt inbox
  - name: Context
    description: Shared inter-agent key/value blackboard
  - name: Messages
    description: Directed inter-agent mailbox
  - name: Collaboration
    description: Inter-agent file-conflict view
  - name: Pipelines
    description: Multi-stage DAG pipelines of dependent jobs
  - name: Projects
    description: First-class projects that agents and pipelines group under
  - name: Snapshots
    description: Worktree + transcript checkpoints
  - name: Savings
    description: Measured token reductions earned by lifecycle features
  - name: Schedules
    description: Recurring (cron) and single-shot (at) agent/pipeline triggers
  - name: Observability
    description: Memory pressure, metrics, history, search
  - name: Filesystem
    description: Directory browsing for the spawn picker
  - name: Import/Export
    description: Session record import

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Health]
      summary: Liveness probe
      description: Public. Pings the store; returns 503 if the store is unavailable.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Health]
      summary: Server capability flags
      description: >
        The optional capabilities this warden daemon supports, as stable string
        flags a client feature-detects against (version-skew negotiation). The
        flag "terminal-sessions" means this daemon understands the session `kind`
        field: it accepts kind=terminal on spawn, supports ?kind= on session list,
        sets `kind` on every session row, and no longer lists `terminal` as a
        backend. A client keys on the flag; absence of `terminal` from
        GET /api/v1/backends is the fallback signal for older daemons.
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilitiesResponse" }

  /api/v1/store/health:
    get:
      operationId: getStoreHealth
      tags: [Health]
      summary: Session-store health
      description: >
        Reports whether the active session store can be read completely. warden
        keeps the active fleet complete-or-error: if any active record cannot be
        decoded (or the underlying segment scan fails), a fleet read returns an
        explicit degradation instead of a silently-short list. This endpoint
        surfaces that state for operator diagnostics and for the TUI's
        last-known-good banner: `healthy=false` with per-failure diagnostics
        (collection, key, failure class, detail) when the active scan is degraded,
        `healthy=true` with an empty failure list otherwise. It always returns 200
        — the health verdict is in the body, not the status code — so a monitoring
        client can distinguish "store is degraded" from "daemon is unreachable".
      responses:
        "200":
          description: Store health verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreHealth" }

  /api/docs:
    get:
      operationId: getApiDocs
      tags: [Documentation]
      summary: Interactive API docs (Swagger UI)
      description: |
        Public. Serves an embedded, offline Swagger UI pointed at the embedded
        spec. Gated by the `api_docs` config setting (default on); returns 404
        when disabled.
      security: []
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Docs disabled (api_docs=false)

  /api/docs/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [Documentation]
      summary: Raw OpenAPI document
      description: Public. Serves this specification. Gated by `api_docs` (404 when disabled).
      security: []
      responses:
        "200":
          description: The OpenAPI 3.x document
          content:
            application/yaml:
              schema: { type: string }
        "404":
          description: Docs disabled (api_docs=false)

  /api/v1/sessions:
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List active sessions
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [agent, terminal] }
          description: >
            filter by session kind: "agent" returns only AI agents (sessions with
            kind empty or "agent"), "terminal" returns only plain shells. Omitted =
            every session, agents and terminals alike (unchanged default).
        - name: all
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Include system sessions. Omitted or false hides sessions tagged system:true.
      responses:
        "200":
          description: All live sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }

  /api/v1/sessions/{id}:
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Get one session by id or name
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404":
          description: Session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/spawn:
    post:
      operationId: spawnAgent
      tags: [Sessions]
      summary: Spawn a new agent
      description: |
        Launches a new Claude Code agent (typed or free-form). When the
        memory-pressure spawn gate warns, returns 428 with a confirmation payload;
        retry with `force: true` to proceed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpawnRequest" }
      responses:
        "201":
          description: The spawned session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "428":
          description: Spawn gate warning — re-submit with force=true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmationResponse" }

  /api/v1/adopt:
    post:
      operationId: adoptSession
      tags: [Sessions]
      summary: Adopt an existing (un-spawned) session
      description: Registers a resume- or live-mode session warden did not spawn.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdoptRequest" }
      responses:
        "201":
          description: The adopted session (plus an optional non-fatal warning)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdoptResponse" }

  /api/v1/sessions/{id}/terminate:
    post:
      operationId: terminateSession
      tags: [Sessions]
      summary: Terminate an agent
      description: Kills the agent's tmux session; keeps the record and worktree.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/delete:
    post:
      operationId: deleteSession
      tags: [Sessions]
      summary: Delete a session record
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteRequest" }
      responses:
        "200":
          description: Deleted (warning set when the agent may still be live)
          content:
            application/json:
              schema:
                type: object
                required: [status, warning]
                properties:
                  status: { type: string }
                  warning: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/remove-worktree:
    post:
      operationId: removeWorktree
      tags: [Sessions]
      summary: Remove the session's git worktree + branch
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveWorktreeRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/input:
    post:
      operationId: sendInput
      tags: [Sessions]
      summary: Send text input to an agent's pane
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InputRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/output:
    get:
      operationId: getOutput
      tags: [Sessions]
      summary: Read recent pane output
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - name: lines
          in: query
          description: Number of trailing lines to capture
          schema: { type: integer }
      responses:
        "200":
          description: Captured output
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutputResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/attach:
    get:
      operationId: attachSession
      tags: [Sessions]
      summary: Attach to an agent's pane (WebSocket)
      description: |
        Upgrades to a WebSocket carrying the live tmux pane (terminal multiplexing).
        Not a request/response endpoint; a successful handshake returns 101.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/cockpit/attach:
    get:
      operationId: attachCockpit
      tags: [Sessions]
      summary: Attach to the web cockpit / TUI (WebSocket)
      description: |
        Upgrades to a WebSocket carrying the daemon-owned three-pane cockpit
        (agent list + master shell/REPL + detail pane) — the same `warden tui`,
        rendered into the browser. The cockpit is built lazily on first attach
        and shared across clients. Not a request/response endpoint; a successful
        handshake returns 101.
      responses:
        "101":
          description: Switching Protocols (WebSocket)

  /api/v1/sessions/{id}/restore:
    post:
      operationId: restoreSession
      tags: [Sessions]
      summary: Restore (re-create + resume) a lost session
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/create-pr:
    post:
      operationId: createPR
      tags: [Sessions]
      summary: Open a GitHub PR for the agent's branch
      description: Push → digest → gh pr create. An existing PR returns Created=false.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base: { type: string, description: "PR base branch ('' = main)" }
      responses:
        "200":
          description: PR result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PRResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/digest:
    get:
      operationId: getDigest
      tags: [Sessions]
      summary: Completion digest for an agent
      description: LLM narrative summary + changed files + branch/turns/status.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          description: The digest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Digest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/auto-approve:
    patch:
      operationId: setAutoApprove
      tags: [Approvals]
      summary: Toggle auto-approve for an agent
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new auto-approve state
          content:
            application/json:
              schema:
                type: object
                required: [auto_approve]
                properties:
                  auto_approve: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/force-compact:
    patch:
      operationId: setForceCompact
      tags: [Sessions]
      summary: Set an agent's force-compact override (on / off / inherit)
      description: >-
        Controls the destructive force-compact path for one agent, overriding the
        global token_force_compact. enabled=true forces it on, false forces it
        off, and null/omitted clears the override so the agent inherits the global
        setting.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [on, off, inherit]
      responses:
        "200":
          description: The new force-compact override (inherit = use global)
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [on, off, inherit]
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/permission-mode:
    patch:
      operationId: setPermissionMode
      tags: [Sessions]
      summary: Set an agent's permission mode
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permission_mode:
                  type: string
                  enum: [auto, default, acceptEdits, bypassPermissions, dontAsk, plan]
      responses:
        "200":
          description: The new permission mode
          content:
            application/json:
              schema:
                type: object
                required: [permission_mode]
                properties:
                  permission_mode: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/role:
    patch:
      operationId: setRole
      tags: [Sessions]
      summary: Set an agent's built-in role
      description: >
        Persists the agent's built-in role name (empty ⇒ general). The role's
        persona is re-resolved from the registry and re-injected the next time the
        agent is (re)launched/resumed — mirroring how permission-mode takes effect.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: "built-in role name (general|orchestrator|implementer|auto-merger|reviewer); empty = general"
      responses:
        "200":
          description: The new role
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/switch:
    post:
      operationId: switchSession
      tags: [Sessions]
      summary: Hot-swap an agent session to a different backend, model, or tier mid-task
      description: >
        Mid-session hot-swap: retire the active CLI process and launch a successor backend
        in the SAME worktree, carrying forward structured context (Goal, Decisions Log,
        Modified Files Diff, Immediate Next Step) so the new agent continues without starting cold.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend:
                  type: string
                  description: "explicit successor backend id (e.g. antigravity)"
                model:
                  type: string
                  description: "explicit successor model id"
                tier:
                  type: string
                  description: "resolve successor via quota-balanced router at this tier (tier-1 | tier-2 | tier-3)"
                role:
                  type: string
                  description: "role to resolve tier from when tier is not given"
                reason:
                  type: string
                  description: "reason recorded for hot-swap (manual | context_fill | quota)"
                prompt:
                  type: string
                  description: "optional extra instruction appended to successor's continuation prompt"
      responses:
        "200":
          description: Hot-swap result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwapResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: Hot-swap execution failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [Sessions]
      summary: List the built-in agent roles
      description: >
        Returns warden's fixed built-in roles (general first, then alphabetical)
        so UIs and clients can present a role picker. Read-only.
      responses:
        "200":
          description: The built-in roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/RoleInfo" }

  /api/v1/roles/tiers:
    get:
      operationId: listRoleTiers
      tags: [Sessions]
      summary: List role-to-tier mappings
      description: >
        Returns default model tier mappings for agent roles. Read-only.
      responses:
        "200":
          description: List of role-to-tier mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleTierMapping" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/roles/tiers/{role}:
    put:
      operationId: setRoleTier
      tags: [Sessions]
      summary: Set the default model tier for an agent role
      description: >
        Updates the default model tier (tier-1 | tier-2 | tier-3) assigned when
        creating agents with this role. Returns the updated mapping.
      parameters:
        - name: role
          in: path
          required: true
          schema: { type: string }
          description: Role name (e.g. architecture, implementation, triage, code-review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  description: "tier-1 | tier-2 | tier-3"
      responses:
        "200":
          description: The updated role-to-tier mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleTierMapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/models:
    get:
      operationId: listModels
      tags: [Sessions]
      summary: List models in the catalog and their assigned tiers
      description: >
        Returns models registered in the catalog, optionally filtered by tier
        (tier-1, tier-2, tier-3). Read-only.
      parameters:
        - name: tier
          in: query
          required: false
          schema:
            type: string
            description: "Optional tier filter: tier-1 | tier-2 | tier-3"
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/models/{backend}/{model}/tier:
    put:
      operationId: setModelTier
      tags: [Sessions]
      summary: Set a model's tier classification
      description: >
        Updates the tier classification (tier-1 | tier-2 | tier-3) for a model
        in the catalog. Returns the updated model entry.
      parameters:
        - name: backend
          in: path
          required: true
          schema: { type: string }
          description: Backend ID (e.g. claude, antigravity, codex)
        - name: model
          in: path
          required: true
          schema: { type: string }
          description: Model ID (e.g. sonnet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  description: "tier-1 | tier-2 | tier-3"
      responses:
        "200":
          description: The updated model entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/handover/settings:
    get:
      operationId: getHandoverSettings
      tags: [Sessions]
      summary: Get handover configuration
      description: >
        Returns the current configuration for mid-session context handover and quota headroom triggers.
      responses:
        "200":
          description: Current handover settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverSettings" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: setHandoverSettings
      tags: [Sessions]
      summary: Update handover configuration
      description: >
        Persists the handover configuration for mid-session context handover and quota headroom triggers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoverSettings" }
      responses:
        "200":
          description: Updated handover settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoverSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Backend registry unconfigured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/backends:
    get:
      operationId: listBackends
      tags: [Sessions]
      summary: Get the agent-backend registry with settings
      description: >
        Returns the persisted agent-backend registry (one row per detected
        backend, sorted by id) plus the store-level settings singleton. The
        registry is warden's source of truth for which backends exist, their
        tier, which one is the default, and whether each is enabled. Detection
        fields (installed/binary_path/detected_at) reflect the most recent
        reconcile — POST /api/v1/backends/rescan to refresh them. Read-only.
      responses:
        "200":
          description: The backend registry and settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendsState" }

  /api/v1/usage:
    get:
      operationId: getUsage
      tags: [Observability]
      summary: Get subscription-backend provider usage
      description: >
        Concurrently queries every persisted backend whose tier is exactly
        subscription. This read does not rescan or mutate registry, routing,
        cooldown, or quota state. Provider errors are sanitized and successful
        rows are retained when another provider fails.
      parameters:
        - name: refresh
          in: query
          description: Bypass the 60-second fresh cache (stale fallback remains available).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Consolidated provider usage snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Backend registry or usage service unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/backends/rescan:
    post:
      operationId: rescanBackends
      tags: [Sessions]
      summary: Re-detect installed backends and return the registry
      description: >
        Sweeps PATH for every registered backend and reconciles the detection
        fields (installed/binary_path/detected_at) into the registry, preserving
        each backend's tier/default/enabled preferences. Returns the refreshed
        registry and settings.
      responses:
        "200":
          description: The refreshed backend registry and settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendsState" }

  /api/v1/backends/default:
    put:
      operationId: setDefaultBackend
      tags: [Sessions]
      summary: Set the default agent backend
      description: >
        Marks one backend as the single default (an empty SpawnRequest.backend
        resolves to it). Rejects an unknown, uninstalled, or disabled backend,
        and the reserved local/terminal rows, with a 4xx. Returns the updated
        registry and settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: The updated backend registry and settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendsState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/backends/thinking-mode:
    put:
      operationId: setThinkingMode
      tags: [Sessions]
      summary: Set the internal-thinking routing mode
      description: >
        Sets how warden routes its own internal (non-user-facing) thinking:
        local_only keeps it on the $0 local model; free_plus_local prefers free
        cloud backends and falls back to the never-limited local model. Returns
        the updated settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  description: "local_only | free_plus_local"
      responses:
        "200":
          description: The updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/backends/{id}:
    patch:
      operationId: patchBackend
      tags: [Sessions]
      summary: Update a backend's tier or enabled flag
      description: >
        Updates a single backend's user preferences. tier assigns a billing
        class (free, subscription, pay_per_use, or unclassified); the reserved
        local tier is system-set and cannot be assigned, nor can the local
        row be re-tiered. enabled toggles whether the backend may be used. Both
        fields are optional — an omitted field is left unchanged. Returns the
        updated backend.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  x-go-type: "*string"
                  description: "free | subscription | pay_per_use | unclassified (omit to leave unchanged)"
                enabled:
                  type: boolean
                  x-go-type: "*bool"
                  description: "omit to leave unchanged"
      responses:
        "200":
          description: The updated backend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backend" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List first-class projects
      description: >
        Returns every persisted project (docs/specs/2026-08-28-project-centric-ui.md
        Phase 1), sorted by display name. A project is the parent that agents and
        pipelines group under via their project_id; worktrees are not projects of
        their own. Closed projects are hibernated (kept, not deleted) and are
        returned here with status "closed" so a client can filter them. Read-only.
      responses:
        "200":
          description: The project list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }

  /api/v1/projects/open:
    post:
      operationId: openProject
      tags: [Projects]
      summary: Register a project and mark it open
      description: >
        Registers a project by its canonical id (the main checkout's local path or
        the remote URL) and marks it open. A first open inserts the row; reopening a
        previously closed project flips it back to open. An empty name or path
        leaves the stored value unchanged, so reopening by id alone never blanks the
        display name. Phase 1 only persists the record — the git clone/init
        mechanics are Phase 2. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenProjectRequest" }
      responses:
        "200":
          description: The opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/projects/{id}/close:
    post:
      operationId: closeProject
      tags: [Projects]
      summary: Hibernate (close) a project
      description: >
        Marks a project closed (IDE-like hibernation): the record is kept, only its
        status flips, and it is hidden from the active cockpit/TUI surfaces until
        reopened. Never deletes the project. Returns the updated project, or 404 if
        the id is unknown.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The closed project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/local:
    post:
      operationId: openLocalProject
      tags: [Projects]
      summary: Open an existing local directory as a project
      description: >
        Normalizes the given directory path to an absolute, symlink-resolved path,
        registers it as a project (id = path = the resolved absolute path), and
        marks it open (docs/specs/2026-08-28-project-centric-ui.md Phase 2, Local).
        The directory must already exist. When name is empty the directory's base
        name is used. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenLocalProjectRequest" }
      responses:
        "200":
          description: The opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/projects/remote:
    post:
      operationId: openRemoteProject
      tags: [Projects]
      summary: Clone a remote URL into the workspace and open it as a project
      description: >
        Clones a GitHub/GitLab URL via `git clone` into <workspace_path>/<repo-name>
        (workspace_path from the live config), registers the clone as a project
        (id = path = the clone destination), and marks it open
        (docs/specs/2026-08-28-project-centric-ui.md Phase 2, Remote). When name is
        empty the repository name derived from the URL is used. Fails if the
        destination already exists. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenRemoteProjectRequest" }
      responses:
        "200":
          description: The cloned and opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/projects/new:
    post:
      operationId: createProject
      tags: [Projects]
      summary: Scaffold a new project in the workspace and open it
      description: >
        Creates <workspace_path>/<name>, runs `git init`, writes a template
        README.md, then `git add . && git commit`, registers the directory as a
        project (id = path = the new directory), and marks it open
        (docs/specs/2026-08-28-project-centric-ui.md Phase 2, New). Fails if the
        target directory already exists. Returns the resulting project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProjectRequest" }
      responses:
        "200":
          description: The created and opened project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/project-groups:
    get:
      operationId: listProjectGroups
      tags: [Projects]
      summary: List project groups
      description: >
        Returns every project group (Project Groups feature, Phase 1), sorted by
        display name. A group is a named collection of projects; a project may
        belong to zero or one group. The TUI shows a project's group beside its
        name. Read-only.
      responses:
        "200":
          description: The project group list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroupList" }
    post:
      operationId: createProjectGroup
      tags: [Projects]
      summary: Create a project group
      description: >
        Creates a new named group holding an optional initial set of project ids.
        The name is required; the id is minted by the store when omitted. Member
        ids are de-duplicated and need not resolve to existing projects. Returns the
        created group (including its minted id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectGroupRequest" }
      responses:
        "200":
          description: The created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/project-groups/{id}:
    get:
      operationId: getProjectGroup
      tags: [Projects]
      summary: Get one project group
      description: Returns the group with the given id, or 404 if it is unknown.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProjectGroup
      tags: [Projects]
      summary: Update a project group
      description: >
        Overwrites the group's name and membership in place. The name is required
        and member ids are de-duplicated. Returns the updated group, 404 if the id
        is unknown, or 400 on a blank name.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectGroupRequest" }
      responses:
        "200":
          description: The updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProjectGroup
      tags: [Projects]
      summary: Delete a project group
      description: >
        Removes the group. The member projects themselves are untouched. Idempotent:
        deleting an unknown id still returns 200.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }

  /api/v1/sessions/{id}/name:
    patch:
      operationId: setName
      tags: [Sessions]
      summary: Rename an agent
      description: A blank name clears it. Rejects an invalid format or a duplicate name.
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: The new name (blank when cleared)
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions/{id}/approve:
    post:
      operationId: approveSession
      tags: [Approvals]
      summary: Answer a recognized permission prompt
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                option: { type: integer, description: "1-based option to select" }
                fingerprint: { type: string, description: "Options fingerprint the UI rendered" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/events:
    post:
      operationId: ingestEvent
      tags: [Events]
      summary: Ingest a Claude hook event
      description: Sent by warden's hooks; appends an event and applies any status transition.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "204":
          description: Unknown session (hooks fail soft)

  /api/v1/hooks/guard:
    post:
      operationId: guardHook
      tags: [Events]
      summary: Isolation guard verdict for a file-mutating tool call
      description: Backs the PreToolUse hook — decides whether an agent may Edit/Write a path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardRequest" }
      responses:
        "200":
          description: Allow/deny verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardVerdict" }

  /api/v1/events/stream:
    get:
      operationId: streamEvents
      tags: [Events]
      summary: Live session snapshot stream (SSE)
      description: |
        Server-Sent Events stream. Emits the full sessions snapshot once on
        connect and again on every state change. Long-lived; not a
        request/response endpoint.
      responses:
        "200":
          description: text/event-stream of session snapshots
          content:
            text/event-stream:
              schema: { type: string }

  /api/v1/pressure:
    get:
      operationId: getPressure
      tags: [Observability]
      summary: Memory-pressure + spawn-gate status
      responses:
        "200":
          description: Pressure status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PressureStatus" }

  /api/v1/metrics:
    get:
      operationId: getMetrics
      tags: [Observability]
      summary: Live resource snapshot
      responses:
        "200":
          description: A metrics sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsSample" }

  /api/v1/metrics/history:
    get:
      operationId: getMetricsHistory
      tags: [Observability]
      summary: Recorded metrics samples or per-agent summaries
      parameters:
        - name: since
          in: query
          description: RFC3339 lower bound
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer }
        - name: summary
          in: query
          description: When true, return per-agent summaries instead of raw samples
          schema: { type: boolean }
        - name: agent
          in: query
          description: Narrow summaries to one agent id (with summary=true)
          schema: { type: string }
      responses:
        "200":
          description: Samples (default) or summaries (summary=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items: { $ref: "#/components/schemas/MetricsSample" }
                  summaries:
                    type: array
                    items: { $ref: "#/components/schemas/AgentSummaryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/worktrees:
    get:
      operationId: listWorktrees
      tags: [Git]
      summary: List a repo's worktrees
      parameters:
        - name: repo
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Worktree listings
          content:
            application/json:
              schema:
                type: object
                required: [worktrees]
                properties:
                  worktrees:
                    type: array
                    items: { $ref: "#/components/schemas/WorktreeListing" }

  /api/v1/prune:
    post:
      operationId: pruneWorktrees
      tags: [Git]
      summary: Reclaim orphan worktrees
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PruneRequest" }
      responses:
        "200":
          description: Per-worktree prune results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/PruneResult" }

  /api/v1/recover:
    post:
      operationId: recoverAgents
      tags: [Sessions]
      summary: Revive archived agent records whose tmux session is still alive
      description: >-
        Scans archived (closed) records for ones whose tmux_session is
        confirmed still alive (a tombstone can be wrongly reaped by a stale
        orphaned status racing a daemon restart — see the poller/reaper
        liveness reconfirm), and re-inserts each one's full original record
        into the active store under its original id. Because a child's
        parent_id is a one-way pointer, any children already reconnect with no
        edits of their own. apply=false (the default) only reports candidates;
        apply=true performs the recovery.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverRequest" }
      responses:
        "200":
          description: Recovery candidates and (if apply) their outcome
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/RecoverResult" }

  /api/v1/git/commit:
    post:
      operationId: gitCommit
      tags: [Git]
      summary: Stage + commit a worktree (rail-enforcing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitCommitRequest" }
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }

  /api/v1/git/push:
    post:
      operationId: gitPush
      tags: [Git]
      summary: Push a worktree's branch to origin (protected-branch refusal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitPushRequest" }
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }

  /api/v1/git/sync:
    post:
      operationId: gitSync
      tags: [Git]
      summary: Rebase a worktree's branch onto origin/base
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitSyncRequest" }
      responses:
        "200":
          description: Sync result (conflicts listed when rebase left in progress)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }

  /api/v1/check:
    post:
      operationId: runCheck
      tags: [Git]
      summary: Run the project's .warden/check.yml command(s)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckRequest" }
      responses:
        "200":
          description: Pass/fail summary (output only for failures)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }

  /api/v1/fs/dirs:
    get:
      operationId: listDirs
      tags: [Filesystem]
      summary: List immediate subdirectories
      parameters:
        - name: path
          in: query
          description: Directory to list (empty = the user's home directory)
          schema: { type: string }
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirListing" }

  /api/v1/fs/clone:
    post:
      operationId: cloneRepo
      tags: [Filesystem]
      summary: Clone a remote Git repository into the configured workspace directory
      description: >
        Backs the "Open remote project" TUI flow. Runs `git clone url` into
        <workspace_path>/<repo-name> (workspace_path is the workspace_path
        config setting, default ~/.warden/workspace), creating the workspace
        directory if needed. Fails if the destination already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloneRepoRequest" }
      responses:
        "200":
          description: Cloned directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloneRepoResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500":
          description: Clone execution failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/approvals:
    get:
      operationId: listApprovals
      tags: [Approvals]
      summary: Live approval queue
      responses:
        "200":
          description: Queue (enabled=false when the feature is off)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalsResponse" }

  /api/v1/auto-approve/policy:
    get:
      operationId: getAutoApprovePolicy
      tags: [Approvals]
      summary: Read the live auto-approve policy
      description: >
        The effective auto-approve policy the poller is running: the default
        allow/deny rules plus any per-agent overrides.
      responses:
        "200":
          description: The current policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoApprovePolicy" }
    put:
      operationId: setAutoApprovePolicy
      tags: [Approvals]
      summary: Replace the live auto-approve policy
      description: >
        Atomically swaps the policy the poller runs (effective immediately, no
        restart) and persists it to the config file's auto_approve block.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoApprovePolicy" }
      responses:
        "200":
          description: The stored policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoApprovePolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/context:
    get:
      operationId: listContext
      tags: [Context]
      summary: List shared-context entries
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Entries under prefix
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/ContextEntry" }

  /api/v1/context/{key}:
    get:
      operationId: getContext
      tags: [Context]
      summary: Read a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setContext
      tags: [Context]
      summary: Write a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
                by: { type: string, description: "writer attribution" }
      responses:
        "200":
          description: The stored entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }
    delete:
      operationId: deleteContext
      tags: [Context]
      summary: Delete a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }

  /api/v1/context/{key}/cas:
    post:
      operationId: casContext
      tags: [Context]
      summary: Compare-and-swap a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected: { type: string, description: "'' = key must be absent" }
                value: { type: string }
                by: { type: string }
      responses:
        "200":
          description: The stored entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }
        "409":
          description: Current value did not match expected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/context/{key}/append:
    post:
      operationId: appendContext
      tags: [Context]
      summary: Atomically append to a shared-context entry
      parameters: [{ $ref: "#/components/parameters/CtxKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
                sep: { type: string, description: "separator inserted before value (skipped when creating)" }
                by: { type: string }
      responses:
        "200":
          description: The stored entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextEntry" }

  /api/v1/sessions/{id}/messages:
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Send a directed message to an agent
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string }
                body: { type: string }
      responses:
        "201":
          description: Stored message + whether the recipient was woken
          content:
            application/json:
              schema:
                type: object
                required: [message, woke]
                properties:
                  message: { $ref: "#/components/schemas/Message" }
                  woke: { type: boolean }
    get:
      operationId: getInbox
      tags: [Messages]
      summary: Read an agent's inbox
      description: Returned messages are marked read.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - name: unread
          in: query
          description: Filter to unread only
          schema: { type: boolean }
      responses:
        "200":
          description: The inbox
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }

  /api/v1/sessions/{id}/messages/wait:
    get:
      operationId: waitForMessage
      tags: [Messages]
      summary: Long-poll for a message
      description: Blocks (server long-poll) until a message arrives or timeout elapses.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - name: timeout
          in: query
          description: Long-poll window in seconds
          schema: { type: integer }
        - name: from
          in: query
          description: Only wait for messages from this sender
          schema: { type: string }
      responses:
        "200":
          description: found=false on timeout
          content:
            application/json:
              schema:
                type: object
                required: [found]
                properties:
                  found: { type: boolean }
                  message:
                    nullable: true
                    x-go-type-skip-optional-pointer: false
                    allOf: [{ $ref: "#/components/schemas/Message" }]

  /api/v1/messages:
    get:
      operationId: listRecentMessages
      tags: [Messages]
      summary: Recent message traffic across all inboxes
      description: Read-only global view; never marks anything read.
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Recent messages, newest first
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }

  /api/v1/collab/conflicts:
    get:
      operationId: getConflicts
      tags: [Collaboration]
      summary: Current inter-agent file conflicts
      responses:
        "200":
          description: Files edited by two or more agents
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items: { $ref: "#/components/schemas/Conflict" }

  /api/v1/collab/branches:
    get:
      operationId: getBranchStatus
      tags: [Collaboration]
      summary: Per-agent CI + branch-vs-main status
      description: >
        Read-only snapshot, recomputed per request, of each tracked agent's
        branch: latest GitHub CI run and how it sits against origin/main
        (behind/ahead/merged). A disabled tracker returns an empty list.
      responses:
        "200":
          description: Branch status for every tracked agent with a branch
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items: { $ref: "#/components/schemas/BranchStatus" }

  /api/v1/pipelines:
    get:
      operationId: listPipelines
      tags: [Pipelines]
      summary: List pipelines
      responses:
        "200":
          description: All pipelines
          content:
            application/json:
              schema:
                type: object
                required: [pipelines]
                properties:
                  pipelines:
                    type: array
                    items: { $ref: "#/components/schemas/Pipeline" }
    post:
      operationId: createPipeline
      tags: [Pipelines]
      summary: Create a pipeline from a YAML spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spec: { type: string, description: "pipeline YAML" }
      responses:
        "201":
          description: The parsed + stored pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/pipelines/{pid}:
    get:
      operationId: getPipeline
      tags: [Pipelines]
      summary: Show one pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200":
          description: The pipeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePipeline
      tags: [Pipelines]
      summary: Delete a pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/start:
    post:
      operationId: startPipeline
      tags: [Pipelines]
      summary: Start a pipeline (reconcile + spawn ready jobs)
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/pause:
    post:
      operationId: pausePipeline
      tags: [Pipelines]
      summary: Pause a pipeline (halt new spawns)
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/resume:
    post:
      operationId: resumePipeline
      tags: [Pipelines]
      summary: Resume a paused pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/cancel:
    post:
      operationId: cancelPipeline
      tags: [Pipelines]
      summary: Cancel a pipeline
      parameters: [{ $ref: "#/components/parameters/PipelineId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/jobs/{job}/emit:
    post:
      operationId: emitPipelineJob
      tags: [Pipelines]
      summary: Emit a job's output (commit work + fan out downstream)
      parameters:
        - { $ref: "#/components/parameters/PipelineId" }
        - { $ref: "#/components/parameters/JobId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/jobs/{job}/edit:
    post:
      operationId: editPipelineJob
      tags: [Pipelines]
      summary: Edit a pending job's prompt and/or handoff
      parameters:
        - { $ref: "#/components/parameters/PipelineId" }
        - { $ref: "#/components/parameters/JobId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string, x-go-type-skip-optional-pointer: false }
                handoff: { type: string, x-go-type-skip-optional-pointer: false }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pipelines/{pid}/jobs/{job}/retry:
    post:
      operationId: retryPipelineJob
      tags: [Pipelines]
      summary: Retry a failed / needs-attention job
      parameters:
        - { $ref: "#/components/parameters/PipelineId" }
        - { $ref: "#/components/parameters/JobId" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/history:
    get:
      operationId: listHistory
      tags: [Observability]
      summary: Browse the archived (closed) session store
      parameters:
        - name: since
          in: query
          description: RFC3339 lower bound
          schema: { type: string, format: date-time }
        - name: type
          in: query
          description: Filter by normalized task type
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Archived sessions, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/search:
    get:
      operationId: search
      tags: [Observability]
      summary: Full-text search across sessions
      parameters:
        - name: q
          in: query
          required: true
          description: Whitespace-separated terms (ANDed)
          schema: { type: string }
        - name: closed
          in: query
          description: Also search the archived store
          schema: { type: boolean }
      responses:
        "200":
          description: Matching sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "400":
          description: Blank query
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/import:
    post:
      operationId: importSessions
      tags: [Import/Export]
      summary: Import session records from an export envelope
      description: Inserts records into the active store (metadata only; worktrees are not recreated).
      parameters:
        - name: merge
          in: query
          description: Overwrite on id collision instead of skipping
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Export" }
      responses:
        "200":
          description: Per-bucket import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }

  /api/v1/snapshots:
    post:
      operationId: createSnapshot
      tags: [Snapshots]
      summary: Capture a worktree + transcript snapshot
      description: Gated by the `snapshots` config setting; returns 403 when disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotCreateRequest" }
      responses:
        "200":
          description: The created snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "403":
          description: Snapshots disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listSnapshots
      tags: [Snapshots]
      summary: List snapshots
      parameters:
        - name: session
          in: query
          description: Filter to one session
          schema: { type: string }
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
        "403":
          description: Snapshots disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/snapshots/{id}/restore:
    post:
      operationId: restoreSnapshot
      tags: [Snapshots]
      summary: Restore a snapshot onto its recorded worktree
      description: Refuses a dirty tree unless force=true; never restores onto main/master.
      parameters: [{ $ref: "#/components/parameters/SnapshotId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResult" }
        "403":
          description: Snapshots disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/savings:
    get:
      operationId: getSavings
      tags: [Savings]
      summary: Aggregated token-savings summary
      description: >
        The measured token reductions warden's lifecycle features have earned
        (raw output kept out of agents' context), as a per-feature breakdown plus
        cumulative tokens, an estimated dollar figure, and the percentage of
        would-be context spend eliminated. Gated by the `savings` config setting;
        returns 403 when disabled.
      parameters:
        - name: since
          in: query
          description: Only count savings since this window (a Go duration like `168h`, or an RFC3339 timestamp). Absent ⇒ all time.
          schema: { type: string }
        - name: bucket
          in: query
          description: "Attach a zero-filled saved-tokens trend at this granularity: hour or day (an unknown value yields no trend)."
          schema: { type: string }
        - name: samples
          in: query
          description: Attach the retained provenance pairs (raw vs. kept samples).
          schema: { type: boolean }
      responses:
        "200":
          description: The savings summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsSummary" }
        "400":
          description: Invalid since value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Savings ledger disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/spend:
    get:
      operationId: getSpend
      tags: [Savings]
      summary: Per-agent / per-repo / per-day cost rollup
      description: >
        Cost governance: the REAL billed Claude spend warden measured from agents'
        transcripts, priced per model into dollars and rolled up per-agent,
        per-repo, and per-day, plus the daily/weekly totals the budget gate
        enforces. Gated by the `savings` config setting; returns 403 when disabled.
      responses:
        "200":
          description: The spend rollup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendReport" }
        "403":
          description: Savings/spend tracking disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot:
    get:
      operationId: getAutopilot
      tags: [Autopilot]
      summary: Autopilot status
      description: >
        Returns the current autopilot status: the master switch plus one entry per
        active run (run id, plan file, repo, state, resolved gate, brain, workers,
        task rollup, backoff). In the inert S1 core the brain is null and the
        counters are zero.
      responses:
        "200":
          description: Autopilot status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotStatus" }
    post:
      operationId: setAutopilot
      tags: [Autopilot]
      summary: Enable or disable autopilot
      description: >
        Flips the autopilot master switch. Enabling runs the enable-time preflight
        (plan file exists + strict-decodes, gh authenticated, integration branch
        present or auto-created, at most one active run per repo, integration
        branch is not a protected name); on any failure it returns 409 with the
        FULL list of actionable failures and changes no state. Disabling is the
        kill switch — it stops spawning/landing immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotToggleRequest" }
      responses:
        "200":
          description: The resulting autopilot status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Enable-time preflight failed (full failure list)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotPreflightFailure" }

  /api/v1/autopilot/runs:
    get:
      operationId: listAutopilotRuns
      tags: [Autopilot]
      summary: List registered autopilot runs
      responses:
        "200":
          description: Durable run registry, including stopped and complete runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutopilotRun" }
    post:
      operationId: registerAutopilotRun
      tags: [Autopilot]
      summary: Register a named plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotRegisterRequest" }
      responses:
        "201":
          description: Registered run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Autopilot is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Run identity or name conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot/runs/{run_id}/{action}:
    parameters:
      - in: path
        name: run_id
        required: true
        schema: { type: string }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [start, pause, resume, stop, unregister] }
    post:
      operationId: controlAutopilotRun
      tags: [Autopilot]
      summary: Start, pause, resume, stop, or unregister one run
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Autopilot is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Illegal lifecycle transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot/runs/{run_id}/rename:
    parameters:
      - in: path
        name: run_id
        required: true
        schema: { type: string }
    post:
      operationId: renameAutopilotRun
      tags: [Autopilot]
      summary: Rename a run's display name and slot scope
      description: >
        Updates the display name and derived slot scope without changing the
        path-derived run_id. The integration branch is unchanged; retarget it
        explicitly with renameAutopilotRunRetarget when ready.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotRenameRequest" }
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Autopilot is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Illegal rename (active run or name conflict)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot/runs/{run_id}/retarget:
    parameters:
      - in: path
        name: run_id
        required: true
        schema: { type: string }
    post:
      operationId: retargetAutopilotRun
      tags: [Autopilot]
      summary: Retarget a run's integration branch
      description: >
        Sets a new stored merge target explicitly or derives one from the run's
        current display name. Open PRs on the previous branch are not migrated;
        land rejects them with wrong_base until rebased or retargeted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotRetargetRequest" }
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Autopilot is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Illegal retarget (active run or branch conflict)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot/land:
    post:
      operationId: landAutopilot
      tags: [Autopilot]
      summary: Land a worker branch into the integration branch
      description: >
        The brain's only merge path (docs/specs/autopilot.md §6). Given an
        autopilot worker agent (id or name) or branch, it checks every
        precondition (owning run active, branch autopilot-owned, a PR based on
        the integration branch, the resolved gate green for the PR head SHA, and
        the PR mergeable), merges with the configured strategy, optionally
        deletes the worker branch, and records the landing authoritatively in the
        run ledger. Idempotent: re-issuing after a merge (or an already-recorded
        head SHA) returns already_landed with no second merge. On a precondition
        failure it returns 409 with a typed `kind`
        (gate_pending|gate_red|ci_missing|not_mergeable|not_owned|run_disabled|wrong_base)
        and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotLandRequest" }
      responses:
        "200":
          description: The landing result (already_landed=true on an idempotent re-issue)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotLandResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Autopilot is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A land precondition failed (typed kind, no side effects)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotLandError" }

  /api/v1/autopilot/complete:
    post:
      operationId: completeAutopilot
      tags: [Autopilot]
      summary: Mark the calling brain's run complete
      description: >
        The brain's completion signal (docs/specs/autopilot.md §2.1): once the
        brain has verified the plan's done_when criteria it declares its run
        complete. The daemon writes an in-place `status: complete` marker into the
        plan file (so preflight skips the plan on every future enable and it can
        never be executed again by mistake), tears the brain down gracefully
        (in-flight workers keep running), and retains the run ledger. Idempotent:
        a second call on an already-complete run is a no-op. The owning run is
        derived from the calling brain's own session identity, so no body is
        needed; only a run's own brain may complete it.
      responses:
        "200":
          description: The resulting autopilot status (the run now reports state=complete)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotStatus" }
        "403":
          description: The caller is not an autopilot brain with a run to complete
          content:
            application/json:
                schema: { $ref: "#/components/schemas/Error" }

  /api/v1/autopilot/tasks/status:
    post:
      operationId: updateAutopilotTaskStatus
      tags: [Autopilot]
      summary: Atomically update one plan task's durable status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutopilotTaskStatusRequest" }
      responses:
        "200":
          description: The persisted task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutopilotPlanTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Caller is not the owning autopilot brain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invalid transition or unverified landed PR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/schedules:
    get:
      operationId: listSchedules
      tags: [Schedules]
      summary: List schedules
      description: Gated by the `scheduler_enabled` config setting; returns 403 when disabled.
      responses:
        "200":
          description: All schedules
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createSchedule
      tags: [Schedules]
      summary: Create a recurring (cron) or single-shot (at) schedule
      description: >
        Fires either an agent spawn (type/repo/prompt/agent/branch) or a pipeline
        (spec). Provide exactly one of cron/at and exactly one fire mode. Gated by
        the `scheduler_enabled` config setting; returns 403 when disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleCreateRequest" }
      responses:
        "201":
          description: The created schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/schedules/{id}:
    get:
      operationId: getSchedule
      tags: [Schedules]
      summary: Get one schedule by id
      description: Gated by the `scheduler_enabled` config setting; returns 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSchedule
      tags: [Schedules]
      summary: Delete a schedule
      description: Gated by the `scheduler_enabled` config setting; returns 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schedules/{id}/enable:
    post:
      operationId: enableSchedule
      tags: [Schedules]
      summary: Enable a schedule
      description: >
        Re-arms a disabled schedule: recomputes next_run from now (cron → next
        occurrence; at → its configured time, which fires on the next tick if
        already past). Idempotent. Gated by `scheduler_enabled`; 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schedules/{id}/disable:
    post:
      operationId: disableSchedule
      tags: [Schedules]
      summary: Disable a schedule
      description: >
        Stops a schedule from firing: clears next_run and leaves it inactive until
        re-enabled. The record and its last-run history are preserved. Idempotent.
        Gated by `scheduler_enabled`; 403 when disabled.
      parameters: [{ $ref: "#/components/parameters/ScheduleId" }]
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "403":
          description: Scheduler disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token. Required on every request (including loopback) when the
        daemon is configured with a token / for non-loopback access. SSE and
        WebSocket clients may pass it as a `?token=` query parameter.

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Session id or name
      schema: { type: string }
    CtxKey:
      name: key
      in: path
      required: true
      description: Dot-namespaced context key (no '/' or '\\')
      schema: { type: string }
    PipelineId:
      name: pid
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: job
      in: path
      required: true
      schema: { type: string }
    SnapshotId:
      name: id
      in: path
      required: true
      description: Snapshot id (snap-<8hex>)
      schema: { type: string }
    ScheduleId:
      name: id
      in: path
      required: true
      description: Schedule id (== its name)
      schema: { type: string }

  responses:
    OK:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: ok }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    SavingsFeature:
      type: object
      description: Rolled-up token saving for one lifecycle feature.
      properties:
        feature: { type: string, example: check }
        events: { type: integer }
        raw_tokens: { type: integer, description: Counterfactual tokens (what would have entered context) }
        kept_tokens: { type: integer, description: Tokens that actually entered context }
        saved_tokens: { type: integer }
        saved_dollars: { type: number, format: double }

    SavingsSummary:
      x-go-type: savings.Summary
      x-go-type-import:
        path: github.com/srjn45/warden/internal/savings
        name: savings
      type: object
      description: Aggregated token savings over the requested window.
      properties:
        since: { type: string, format: date-time }
        events: { type: integer }
        raw_tokens: { type: integer }
        kept_tokens: { type: integer }
        saved_tokens: { type: integer }
        saved_dollars: { type: number, format: double }
        reduction_pct:
          type: number
          format: double
          description: saved ÷ (saved + kept), as a percentage
        features:
          type: array
          items: { $ref: "#/components/schemas/SavingsFeature" }

    SpendBucket:
      x-go-type: spend.Bucket
      x-go-type-import:
        path: github.com/srjn45/warden/internal/spend
        name: spend
      type: object
      description: One cost rollup row — an agent, repo, or day — with priced spend.
      properties:
        key: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        usd: { type: number, format: double }
      required: [key, input_tokens, output_tokens, usd]

    SpendReport:
      x-go-type: spend.Report
      x-go-type-import:
        path: github.com/srjn45/warden/internal/spend
        name: spend
      type: object
      description: Measured Claude spend, priced per model and rolled up three ways.
      properties:
        total_usd: { type: number, format: double }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        by_agent: { type: array, items: { $ref: "#/components/schemas/SpendBucket" } }
        by_repo: { type: array, items: { $ref: "#/components/schemas/SpendBucket" } }
        by_day: { type: array, items: { $ref: "#/components/schemas/SpendBucket" } }
        daily_usd: { type: number, format: double }
        weekly_usd: { type: number, format: double }
      required: [total_usd, input_tokens, output_tokens, daily_usd, weekly_usd]

    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    CapabilitiesResponse:
      type: object
      required: [capabilities]
      description: The optional capability flags this daemon supports (feature detection).
      properties:
        capabilities:
          type: array
          items: { type: string }
          description: >
            Stable capability-flag strings. Known flags: "terminal-sessions"
            (session `kind` support — see GET /api/v1/capabilities), "store-health"
            (the GET /api/v1/store/health endpoint + complete-or-error active
            reads / 503 on degradation), "backend-recovery" (the session
            `backend_recovery` field is present and SSE fires on recovery phase
            changes — reactive hard-limit provider switching is active).

    StoreScanFailure:
      type: object
      required: [collection, class, detail]
      description: One record (or whole-scan) failure encountered reading the store.
      properties:
        collection:
          type: string
          description: 'The store collection the failure is in (e.g. "active").'
        key:
          type: string
          description: >
            The session id of the unreadable record, when the engine surfaced it;
            empty for a whole-scan (segment/checksum) failure that aborted before
            any record could be examined.
        class:
          type: string
          enum: [decode, read]
          description: >
            Failure class: "decode" = the record's stored payload would not decode
            into a session (shape-invalid); "read" = the underlying segment scan
            itself failed (framing, checksum, or index read).
        detail:
          type: string
          description: Human-readable failure detail.

    StoreHealth:
      type: object
      required: [healthy, degraded, failure_count, failures, checked_at]
      description: >
        Health verdict for the active session store. `healthy` is the top-line
        boolean; `degraded` is its inverse, provided for readability. When
        degraded, `failures` carries structured per-record diagnostics.
      properties:
        healthy:
          type: boolean
          description: True when the active fleet can be read completely.
        degraded:
          type: boolean
          description: True when one or more active records cannot be read (inverse of healthy).
        failure_count:
          type: integer
          description: Number of unreadable records (or 1 for a whole-scan failure).
        failures:
          type: array
          items: { $ref: "#/components/schemas/StoreScanFailure" }
          description: Per-failure diagnostics; empty when healthy.
        checked_at:
          type: string
          format: date-time
          description: When this health check ran (server time, UTC).

    Status:
      type: string
      description: Agent lifecycle status
      enum: [spawning, working, waiting_for_input, idle, done, errored, orphaned, rate_limited]

    TaskType:
      type: string
      description: Normalized task type
      enum: [development, analysis, spike, pr-review, code, docs, website, debug-ci, tests, other]

    Event:
      x-go-type: store.Event
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      properties:
        ts: { type: string, format: date-time }
        type: { type: string }
        detail: { type: string }

    BackendCandidate:
      x-go-type: store.BackendCandidate
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: >
        Identifies one provider capacity pool by (backend_id, model_id). Model is
        part of the identity because providers may meter independent model pools
        separately — two models on the same backend can have unrelated limits.
      properties:
        backend_id: { type: string, description: "Agent backend identifier (e.g. claude, codex)." }
        model_id: { type: string, description: "Model identifier within that backend." }
      required: [backend_id, model_id]

    RecoveryAttempt:
      x-go-type: store.RecoveryAttempt
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: One attempt to switch to a candidate during reactive hard-limit recovery.
      properties:
        candidate: { $ref: "#/components/schemas/BackendCandidate" }
        round:
          type: integer
          format: uint64
          description: >
            Recovery round index. 0 = first attempt; increments after each
            waiting_for_capacity → retry cycle.
        started_at: { type: string, format: date-time }
        outcome:
          type: string
          description: >
            "hard_limit" = original pool confirmed limited at recovery start;
            "immediate_hard_limit" = candidate hit a limit right after switching;
            "launch_failed" = process or handoff launch failed;
            "stabilized" = successfully stabilized (recovery complete);
            "superseded" = invalidated by a manual switch/stop/delete.
      required: [candidate, round, started_at, outcome]

    RecoveryReset:
      x-go-type: store.RecoveryReset
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: >
        Known reset window for a limited backend/model pool, as reported by the
        provider via the backend-usage service. resets_at is null when the provider
        supplied no reset time; never coerce null to zero or any synthetic value —
        render as "unknown".
      properties:
        backend_id: { type: string }
        limit_id: { type: string, description: "Provider-assigned limit identifier (stable key)." }
        scope: { type: string, description: "Stable scope key for display. Never use as a locator." }
        resets_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When this limit resets, in UTC. Null means the provider gave no reset
            time. Never coerce null to zero, a past time, or "full"; render as "unknown".
      required: [backend_id, limit_id, scope]

    BackendRecovery:
      x-go-type: store.BackendRecovery
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      description: >
        Reactive hard-limit recovery state. Non-null on a session while the
        coordinator is automatically switching to a new provider after a confirmed
        hard usage limit. Null means no recovery is active.

        Phase strings (§8 of the reactive-backend-limit-recovery spec):
          "refreshing_usage"    → UI: "recovering: refreshing usage"
          "switching"           → UI: "recovering: trying <backend>/<model> (n/m)"
          "stabilizing"         → UI: "recovering: stabilizing <backend>/<model>"
          "waiting_for_capacity"→ UI: "waiting for capacity; retry <time|fallback>; attempted n"
        A superseded recovery is cleared and the session carries no BackendRecovery.

        PRIVACY: this field never exposes provider credentials, account or email
        identifiers, raw CLI/provider output, terminal banners, prompts, or
        transcript content. Unknown usage/resets render as "unknown" — never as
        zero or "full". Exact percentages are omitted from remote API surfaces.

        SSE notifications (GET /api/v1/events) fire on phase changes; subscribe
        there for live updates without polling. The "backend-recovery" capability
        flag (GET /api/v1/capabilities) signals that this field is supported.
      properties:
        generation:
          type: integer
          format: uint64
          description: >
            Monotonic generation counter. Increments each time a new recovery
            starts. Generation-checked callbacks ensure stale timers and late
            poll events cannot overwrite a newer manual action.
        round:
          type: integer
          format: uint64
          description: >
            Retry round index. 0 = first sequential attempt; increments after each
            waiting_for_capacity → retry refresh cycle.
        phase:
          type: string
          enum: [refreshing_usage, switching, stabilizing, waiting_for_capacity]
          description: >
            Current recovery phase. See schema description for UI string mapping.
        original:
          $ref: "#/components/schemas/BackendCandidate"
          description: The backend/model pool that hit the confirmed hard limit.
        current:
          allOf:
            - $ref: "#/components/schemas/BackendCandidate"
          nullable: true
          description: >
            Backend/model currently being tried or in stabilization. Null when
            no candidate has been selected yet or between sequential attempts.
        attempts:
          type: array
          items: { $ref: "#/components/schemas/RecoveryAttempt" }
          description: >
            Ordered history of all candidate attempts in the current generation.
            Use len(attempts) for "attempted n" in status display.
        resets:
          type: array
          items: { $ref: "#/components/schemas/RecoveryReset" }
          description: >
            Known reset windows for exhausted pools, used to schedule the next
            retry. May be empty when no provider supplied reset times.
        next_retry_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Earliest time the coordinator will retry after waiting_for_capacity.
            Null when not in the waiting phase or no retry is scheduled.
            Never coerce null to zero or a synthetic time.
        stable_since:
          type: string
          format: date-time
          nullable: true
          description: >
            Start of the stabilization observation window. Null until the first
            live non-rate-limited poll arrives after a candidate switch. For
            display only; cleared on recovery completion.
        updated_at:
          type: string
          format: date-time
          description: When this recovery record was last written (UTC).
      required: [generation, round, phase, original, attempts, updated_at]

    Session:
      x-go-type: store.Session
      x-go-type-import:
        path: github.com/srjn45/warden/internal/store
        name: store
      type: object
      properties:
        id:
          type: string
          description: >
            opaque, kind-agnostic session token. Not a kind hint — ids may use
            the `agent-` prefix, `guardian-*`, `<pipeline>-<job>`, or plan-scoped
            autopilot slot forms. Never parse kind (or anything else) from the id;
            classify with the `kind` field.
        name:
          type: string
          description: >
            optional human-friendly alias. Omitted from the JSON when unset
            (encoded with `omitempty`), so an absent key decodes as null/empty —
            terminals and un-named agents carry no name. Treat as optional and
            never derive identity or kind from it.
        type: { $ref: "#/components/schemas/TaskType" }
        ticket: { type: string }
        tmux_session: { type: string }
        claude_session_id: { type: string }
        repo: { type: string }
        worktree: { type: string }
        branch: { type: string }
        worktree_created: { type: boolean }
        branch_created: { type: boolean }
        pr: { type: string }
        prompt: { type: string }
        workdir: { type: string }
        subject: { type: string }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/Status" }
        kind:
          type: string
          enum: [agent, terminal]
          description: >
            session kind. Absent or empty means "agent" (back-compat: records that
            predate the field, and every AI agent, read as agents). "terminal" is a
            plain shell, excluded from AI-centric surfaces. Present on EVERY session
            row so a client can classify without heuristics.
        pid: { type: integer }
        exit_code: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        last_pane_excerpt: { type: string }
        auto_restart: { type: boolean }
        restart_count: { type: integer }
        permission_mode: { type: string }
        auto_approve: { type: boolean }
        role: { type: string, description: "built-in role name; empty = general (no persona)" }
        task: { type: string, description: "assigned task dimension from the registry" }
        pipeline_id: { type: string }
        job_id: { type: string }
        schedule_id:
          type: string
          description: >
            back-ref to the schedule that fired this run. Set on schedule-spawned
            sessions — agent-mode fires directly, and pipeline-mode job sessions
            inherit it from the scheduled pipeline. Absent (omitempty) on normal
            operator/CLI/API spawns. Present the same way in GET /sessions,
            GET /sessions/{id}, and the SSE event stream, so a client can tag a
            running session as schedule-origin and keep it out of the plain agents
            list by filtering this one field.
        schedule_name:
          type: string
          description: >
            operator-facing name of that schedule (== schedule_id today), carried
            for display so a client need not re-fetch the schedule. Absent when
            schedule_id is.
        autopilot_run_id:
          type: string
          description: >
            back-ref to the owning autopilot run id (`ap-…`). Set on manager,
            guardian, and worker sessions in the plan-scoped hierarchy. Absent
            (omitempty) on non-autopilot sessions and legacy records.
        autopilot_slot:
          type: string
          enum: [autopilot, guardian, worker]
          description: >
            which slot in the plan-scoped tree this session occupies. Absent on
            non-autopilot sessions.
        autopilot_task_id:
          type: string
          description: >
            plan task id for worker sessions. Absent on manager/guardian slots and
            non-autopilot sessions.
        model: { type: string }
        project_id:
          type: string
          description: >
            back-ref to the first-class project (GET /api/v1/projects) this agent
            belongs to; empty/absent = ungrouped. It is the PARENT project's id: an
            agent in a git worktree links to its repo's project here and carries its
            own worktree path in `worktree` — a worktree is never a project of its
            own. Present the same way across GET /sessions, GET /sessions/{id}, and
            the SSE stream so a client can group agents by project.
        context_tokens: { type: integer }
        context_state: { type: string, enum: ["", ok, warning, critical] }
        backend_recovery:
          allOf:
            - $ref: "#/components/schemas/BackendRecovery"
          nullable: true
          description: >
            Reactive hard-limit recovery state. Null when no automatic recovery
            is active. Non-null while the coordinator is refreshing usage,
            trying a candidate (switching), stabilizing, or waiting for capacity
            after all candidates were exhausted.
            SSE (GET /api/v1/events) fires on phase transitions — subscribe there
            rather than polling. Requires the "backend-recovery" capability flag.
      required: [id, type, status, created_at, updated_at]

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        degraded:
          type: boolean
          description: True when unreadable archive records were skipped and this list is incomplete.
        skipped_records:
          type: integer
          description: Number of unreadable archive records omitted from this response.

    SpawnRequest:
      type: object
      properties:
        type: { type: string, description: "task type (typed mode); empty = free-form" }
        ticket: { type: string }
        name: { type: string }
        repo: { type: string, description: "required in typed mode" }
        branch: { type: string }
        pr: { type: string }
        worktree: { type: boolean }
        in_repo: { type: boolean }
        prompt: { type: string }
        cwd: { type: string }
        permission_mode: { type: string }
        auto_restart: { type: boolean }
        force: { type: boolean, description: "bypass the memory-pressure spawn gate" }
        model: { type: string }
        backend: { type: string, description: "agent backend id (claude, aider, …); empty = claude (the default)" }
        kind:
          type: string
          enum: [agent, terminal]
          description: >
            session kind. Empty or "agent" (the default) creates an AI agent with
            the chosen backend. "terminal" creates a plain interactive shell
            (${SHELL:-bash}) in `cwd` — NOT an AI agent: `backend`, `model`,
            `role`, and `prompt` are ignored, and it is excluded from every
            AI-centric surface (spend, state, approvals, digests). A terminal is
            created here, not via a backend id — the `terminal` backend was
            removed (advertised by the `terminal-sessions` capability, see
            GET /api/v1/capabilities).
        tags: { type: array, items: { type: string } }
        parent_id: { type: string, description: "id of the agent that spawned this one; empty = root" }
        role: { type: string, description: "built-in agent role name (general|orchestrator|implementer|auto-merger|reviewer); empty = general (no persona). The role's persona is injected as a system-prompt addendum and its default flags fill any request fields left unset." }
        tier: { type: string, description: "explicit model tier (tier-1|tier-2|tier-3) for the quota-balanced resolver that picks the backend+model at spawn. Empty derives the tier from task, then role. A pinned backend/model still wins over the resolver." }
        task: { type: string, description: "task name (task registry) used to derive the model tier via the task→tier map when tier is empty. Empty = none." }
        fork_from:
          type: string
          description: >
            id of an existing agent whose recorded session this spawn should FORK
            (codex fork): the new agent branches the source agent's conversation
            into a divergent session. Requires a backend implementing SessionForker
            and a source agent whose backend session id is already pinned. Empty =
            a normal (non-fork) spawn.

    RoleInfo:
      type: object
      description: A built-in agent role for the picker (name + one-line description).
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    Backend:
      x-go-type: backendstore.Backend
      x-go-type-import:
        path: github.com/srjn45/warden/internal/backendstore
        name: backendstore
      type: object
      description: >
        One row of the agent-backend registry. Detection fields
