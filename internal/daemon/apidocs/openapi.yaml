                type: object
                properties:
                  stage: { type: integer }
                  next_retry_at: { type: string }
                  last_error: { type: string }
                  kind:
                    type: string
                    enum: [backend_unavailable, no_backend_selectable, definition_error, spawn_error]
                    description: classified cause of the current backoff
              needs_attention:
                type: string
                description: set when the guardian parked the run because a failure cannot succeed on retry; carries the reason and how to clear it
              last_progress_at: { type: string, description: "RFC3339 time of the run's last observed progress (ledger task change, landing, plan task status change, worker spawn); heartbeats and nudges do not count" }
              watchdog: { type: string, enum: [disabled, idle, armed, escalating, parked], description: "progress watchdog state" }
              next_step:
                type: object
                description: the guardian's scheduled next action for this run (absent for complete, paused, stopped or registered runs)
                properties:
                  action: { type: string }
                  at: { type: string, description: "RFC3339 time the action fires; empty when it waits for an operator" }
                  owner: { type: string, description: "guardian | overwatch | operator" }
              final_pr:
                type: object
                description: the single final PR (integration -> default branch) once autopilot opened it; persisted across daemon restarts
                properties:
                  number: { type: integer }
                  url: { type: string }
                  head_sha: { type: string }
                  gate: { type: string, enum: [pending, red, green] }
                  fix_attempts: { type: integer }
              last_diagnosis:
                type: object
                description: the guardian's last triage decision for this run; persisted across daemon restarts
                properties:
                  action: { type: string, description: "wait|nudge|resolve_prompt|resume_rate_limit|redeliver_prompt|restart|rotate|call_resolver|mechanical" }
                  confidence: { type: number }
                  rationale: { type: string }
                  fail_open_reason: { type: string, description: "why triage fell open to the mechanical ladder; empty when it did not" }
                  source: { type: string, enum: [heuristic, model, failopen] }
                  outcome: { type: string, enum: [applied, mechanical] }
                  at: { type: string, description: RFC3339 }
              fix:
                type: array
                description: per-task gate and fix-loop state for every task that ever went red or conflicted
                items:
                  type: object
                  properties:
                    task: { type: string }
                    pr: { type: integer }
                    gate: { type: string, enum: [red, conflict, clear] }
                    kind: { type: string, enum: [red, conflict] }
                    red_streak: { type: integer }
                    fix_attempts: { type: integer }
                    reruns: { type: integer }
                    fixing: { type: boolean }
                    last_dispatched_sha: { type: string }
                    updated_at: { type: string }
              resolver:
                type: object
                description: resolver-agent activity for this run; persisted across daemon restarts
                properties:
                  attempts: { type: integer, description: "resolver agents started for this run" }
                  last_class: { type: string, enum: [red_gate, manager_stall] }
                  last_task: { type: string }
                  last_branch: { type: string }
                  last_outcome: { type: string, enum: [started, exhausted, start_failed] }
                  last_at: { type: string }
              resting_until: { type: string, description: "RFC3339 time the guardian next resumes or re-switches a rate-limited agent of this run" }
              landed_total: { type: integer }
              guardian_id: { type: string }
              slot_scope: { type: string, description: "stable scope token for manager/guardian slot ids" }
              manager_slot_id: { type: string, description: "stable manager session id (<scope>-autopilot)" }
              guardian_slot_id: { type: string, description: "stable guardian session id (<scope>-guardian)" }
              integration_branch: { type: string, description: "resolved per-plan merge target workers must base PRs on" }
              gate_warning: { type: string, description: "set when gate auto downgraded to local because workflows do not cover the integration branch" }
              workers:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
                description: "task_id -> worker session ids (tree grouping metadata)"
      required: [enabled, runs]

    AutopilotPreflightFailure:
      type: object
      description: >
        409 body when enable-time preflight fails — the full list of actionable
        failures so the owner fixes everything in one pass (autopilot.md §5.1).
      properties:
        error: { type: string }
        failures:
          type: array
          items: { type: string }
      required: [error, failures]

    AutopilotLandRequest:
      type: object
      description: Body for POST /autopilot/land — the worker to land (autopilot.md §6).
      properties:
        agent_or_branch:
          type: string
          description: an autopilot worker agent (id or name) or a branch name
      required: [agent_or_branch]

    AutopilotTaskStatusRequest:
      type: object
      properties:
        run_id: { type: string }
        task_id: { type: string }
        status: { type: string, enum: [pending, active, done, failed] }
        landed_pr: { type: integer, minimum: 1 }
      required: [run_id, task_id, status]

    BrainConsultRequest:
      type: object
      description: >
        Body for POST /autopilot/brain-consult — situation package handed to the
        shared Consultor (docs/specs/2026-09-27-brain-consult.md §D1/D3). The
        manager fills intent/situation/goal/evidence; the daemon derives run_id
        from the caller and writes the audit trail.
      properties:
        intent:
          type: string
          description: one-line summary, e.g. "unblock stuck worker"
        situation:
          type: string
          description: free-form description of the current state
        goal:
          type: string
          description: desired outcome
        already_tried:
          type: array
          items: { type: string }
          description: actions already attempted (matched against Action constants)
        evidence:
          type: string
          description: log excerpts, error messages, agent output snippets
        allowed:
          type: array
          items:
            type: string
            enum: [wait, nudge_agent, retry_job, mark_failed, skip_job, escalate, noop]
          description: >
            subset of closed actions the caller accepts; omit for the autopilot
            default (nudge_agent, wait, escalate, noop)
        task_id:
          type: string
          description: optional task id for the audit trail
      required: [intent]

    BrainConsultResult:
      type: object
      description: >
        The closed action the short-lived brain recommended. The manager
        executes it (nudge the worker, wait, escalate, …) — the daemon does
        not mutate workers or the ledger on this path.
      properties:
        action:
          type: string
          enum: [wait, nudge_agent, retry_job, mark_failed, skip_job, escalate, noop]
        reason: { type: string, description: one-line explanation from the brain }
        brain_id: { type: string, description: agent id of the spawned (now torn-down) brain }
      required: [action, reason, brain_id]

    AutopilotPlanTask:
      type: object
      properties:
        id: { type: string }
        prompt: { type: string }
        after: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, active, done, failed] }
        landed_pr: { type: integer }
      required: [id, prompt, after, status]

    AutopilotLandResult:
      type: object
      description: >
        A successful land (autopilot.md §6). already_landed=true means the merge
        had already happened (idempotent re-issue); sha then carries the recorded
        or merge commit and no new merge was performed.
      properties:
        sha: { type: string, description: the merge commit SHA }
        pr: { type: integer, description: the merged PR number }
        branch: { type: string, description: the landed worker branch }
        already_landed: { type: boolean }
      required: [sha, branch, already_landed]

    AutopilotLandError:
      type: object
      description: >
        409 body when a land precondition fails (autopilot.md §6). kind is the
        typed failure the brain reasons over; detail carries context such as the
        failing check/CI summary for gate_red. No side effects occurred.
      properties:
        error: { type: string }
        kind:
          type: string
          enum: [gate_pending, gate_red, ci_missing, not_mergeable, not_found, not_owned, run_disabled, wrong_base]
        detail: { type: string }
      required: [error, kind]
