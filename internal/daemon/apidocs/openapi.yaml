        agent: { type: string, description: "optional name for the spawned agent" }
        branch: { type: string, description: "optional development branch / pr-review checkout" }
        spec: { type: string, description: "pipeline YAML; non-empty selects pipeline mode" }

    Schedule:
      x-go-type: schedule.Schedule
      x-go-type-import:
        path: github.com/srjn45/warden/internal/schedule
        name: schedule
      type: object
      properties:
        id: { type: string, description: "== name; stable key" }
        name: { type: string }
        kind:
          type: string
          enum: [cron, at]
          description: >
            CADENCE, not fire mode: `cron` = recurring, `at` = single-shot. This
            is NOT "agent vs pipeline" — that distinction is the `mode` field
            below. Do not confuse the two.
        mode:
          type: string
          enum: [agent, pipeline]
          description: >
            what the schedule fires: `agent` = one agent spawn (type/repo/prompt/
            agent/branch), `pipeline` = a whole pipeline (spec). This is the
            agent-vs-pipeline distinction a UI usually labels "type".
        cron: { type: string, description: "recurring spec; present when kind=cron" }
        at: { type: string, description: "single-shot time; present when kind=at" }
        enabled: { type: boolean }
        type: { type: string }
        repo: { type: string }
        prompt: { type: string }
        agent: { type: string }
        branch: { type: string }
        spec: { type: string }
        created_at: { type: string, format: date-time }
        last_run: { type: string, format: date-time, description: "time of the most recent fire; absent if never fired" }
        next_run: { type: string, format: date-time, description: "next scheduled fire; absent when disabled or an exhausted one-shot" }
        last_error: { type: string }
        last_run_session_id:
          type: string
          description: >
            durable id of the most recent fire's result — the spawned agent
            (agent mode) or the created pipeline (pipeline mode). Survives even
            after that session is rotated/deleted, so a schedule row can always
            link to its last run. Empty until the first fire.
        last_run_status:
          type: string
          description: >
            live status of last_run_session_id (running → exited/error),
            refreshed each reconcile tick while the session record still exists.
            Empty once the session is gone or before the first fire.

    AutopilotToggleRequest:
      type: object
      description: >
        Body for POST /autopilot — the per-repo switch. `repo` scopes the toggle to
        one repository; omitted, it defaults to the daemon's working directory.
      properties:
        enabled: { type: boolean, description: true enables autopilot for the repo (runs preflight), false is the kill switch }
        repo: { type: string, description: "repo root to toggle (optional; defaults to the daemon's working directory)" }
      required: [enabled]

    AutopilotStatus:
      x-go-type: autopilot.Status
      x-go-type-import:
        path: github.com/srjn45/warden/internal/autopilot
        name: autopilot
      type: object
      description: >
        The autopilot master switch plus one entry per active run
        (docs/specs/autopilot.md §5). The Go shape is autopilot.Status; the
        properties below document the wire contract.
      properties:
        enabled: { type: boolean, description: "true when any repo has autopilot switched on" }
        enabled_repos:
          type: array
          description: "repo roots currently switched on (the per-repo switch is not a single global flag)"
          items: { type: string }
        runs:
          type: array
          items:
            type: object
            properties:
              run_id: { type: string }
              plan_file: { type: string }
              repo: { type: string }
              state: { type: string, enum: [disabled, starting, active, degraded, healing, complete] }
              gate: { type: string, description: "resolved gate mode (ci|local) or the configured mode in the S1 inert core" }
              brain:
                nullable: true
                type: object
                properties:
                  agent_id: { type: string }
                  backend: { type: string }
                  tier: { type: string }
                  last_heartbeat: { type: string }
                  context_level: { type: string }
              workers_in_flight: { type: integer }
              tasks:
                type: object
                properties:
                  pending: { type: integer }
                  in_progress: { type: integer }
                  landed: { type: integer }
              backoff:
                nullable: true
                type: object
                properties:
                  stage: { type: integer }
                  next_retry_at: { type: string }
                  last_error: { type: string }
              landed_total: { type: integer }
      required: [enabled, runs]

    AutopilotPreflightFailure:
      type: object
      description: >
        409 body when enable-time preflight fails — the full list of actionable
        failures so the owner fixes everything in one pass (autopilot.md §5.1).
      properties:
        error: { type: string }
        failures:
          type: array
          items: { type: string }
      required: [error, failures]

    AutopilotLandRequest:
      type: object
      description: Body for POST /autopilot/land — the worker to land (autopilot.md §6).
      properties:
        agent_or_branch:
          type: string
          description: an autopilot worker agent (id or name) or a branch name
      required: [agent_or_branch]

    AutopilotLandResult:
      type: object
      description: >
        A successful land (autopilot.md §6). already_landed=true means the merge
        had already happened (idempotent re-issue); sha then carries the recorded
        or merge commit and no new merge was performed.
      properties:
        sha: { type: string, description: the merge commit SHA }
        pr: { type: integer, description: the merged PR number }
        branch: { type: string, description: the landed worker branch }
        already_landed: { type: boolean }
      required: [sha, branch, already_landed]

    AutopilotLandError:
      type: object
      description: >
        409 body when a land precondition fails (autopilot.md §6). kind is the
        typed failure the brain reasons over; detail carries context such as the
        failing check/CI summary for gate_red. No side effects occurred.
      properties:
        error: { type: string }
        kind:
          type: string
          enum: [gate_pending, gate_red, ci_missing, not_mergeable, not_owned, run_disabled, wrong_base]
        detail: { type: string }
      required: [error, kind]
