<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 240" role="img" aria-label="Warden">
  <!-- warden wordmark (dark backgrounds) — badge W doubles as the 'w' in "warden" -->
  <!-- Palette: Slate #36506B  Paper #EEF2F5 -->
  <!-- NOTE: "arden" uses a system font for preview. Convert text to outlines in a
       vector editor before production so the wordmark renders identically everywhere. -->

  <!-- Badge (self-contained slate fill reads fine on dark) -->
  <polygon points="120,20 206.6,70 206.6,170 120,220 33.4,170 33.4,70"
           fill="#36506B" stroke="#36506B" stroke-width="14" stroke-linejoin="round"/>
  <polygon points="120,44 185.8,82 185.8,158 120,196 54.2,158 54.2,82"
           fill="none" stroke="#EEF2F5" stroke-width="5" stroke-linejoin="round"/>
  <polyline points="70,84 95,156 120,112 145,156 170,84"
            fill="none" stroke="#EEF2F5" stroke-width="17"
            stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="70,84 95,156 120,112 145,156 170,84"
            fill="none" stroke="#36506B" stroke-width="8"
            stroke-linejoin="round" stroke-linecap="round"/>

  <!-- "arden" in Paper for dark backgrounds -->
  <text x="246" y="161" fill="#EEF2F5"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="132" font-weight="500" letter-spacing="-3">arden</text>
</svg>
