<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="warden architecture: CLI, TUI, Web, MCP and an experimental REPL client talk to a local daemon, which persists to a file store and drives a tmux session running claude per agent, with lifecycle hooks reporting back to the daemon">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- connectors (drawn first so boxes sit on top) -->
  <g fill="none" stroke="#8b949e" stroke-width="2">
    <!-- clients -> daemon -->
    <line x1="100" y1="78" x2="290" y2="170" marker-end="url(#arrow)"/>
    <line x1="255" y1="78" x2="350" y2="170" marker-end="url(#arrow)"/>
    <line x1="410" y1="78" x2="410" y2="170" marker-end="url(#arrow)"/>
    <line x1="565" y1="78" x2="470" y2="170" marker-end="url(#arrow)"/>
    <line x1="720" y1="78" x2="530" y2="170" marker-end="url(#arrow)"/>
    <!-- daemon -> file store -->
    <line x1="340" y1="236" x2="245" y2="320" marker-end="url(#arrow)"/>
    <!-- daemon -> tmux -> claude -->
    <line x1="500" y1="236" x2="540" y2="320" marker-end="url(#arrow)"/>
    <line x1="540" y1="374" x2="540" y2="440" marker-end="url(#arrow)"/>
    <!-- hooks: claude -> daemon -->
    <path d="M655,452 C775,420 780,250 565,212" marker-end="url(#arrow)"/>
  </g>

  <!-- client boxes -->
  <g fill="#1f6feb" stroke="#0b3d91" stroke-width="1.5">
    <rect x="30"  y="24" width="140" height="54" rx="8"/>
    <rect x="185" y="24" width="140" height="54" rx="8"/>
    <rect x="340" y="24" width="140" height="54" rx="8"/>
    <rect x="495" y="24" width="140" height="54" rx="8"/>
  </g>
  <!-- REPL (experimental) client -->
  <rect x="650" y="24" width="140" height="54" rx="8" fill="#1f6feb" stroke="#0b3d91" stroke-width="1.5" stroke-dasharray="5 3"/>

  <g fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">
    <text x="100" y="57">CLI</text>
    <text x="255" y="57">TUI</text>
    <text x="410" y="57">Web</text>
    <text x="565" y="57">MCP</text>
    <text x="720" y="50">REPL</text>
  </g>
  <text x="720" y="68" text-anchor="middle" fill="#cfe0ff" font-size="11" font-style="italic">experimental</text>

  <!-- daemon -->
  <rect x="260" y="170" width="300" height="66" rx="10" fill="#238636" stroke="#0f5323" stroke-width="1.5"/>
  <text x="410" y="200" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">daemon</text>
  <text x="410" y="222" text-anchor="middle" fill="#d7f5dd" font-size="13">single writer · 127.0.0.1:8765</text>

  <!-- file store -->
  <rect x="110" y="320" width="250" height="66" rx="10" fill="#8957e5" stroke="#4c2889" stroke-width="1.5"/>
  <text x="235" y="350" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">file store</text>
  <text x="235" y="372" text-anchor="middle" fill="#e7ddfb" font-size="13">JSON under ~/.warden</text>

  <!-- tmux -->
  <rect x="470" y="320" width="140" height="54" rx="10" fill="#9e6a03" stroke="#5c3e02" stroke-width="1.5"/>
  <text x="540" y="353" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">tmux</text>

  <!-- claude (per agent) -->
  <rect x="460" y="440" width="200" height="58" rx="10" fill="#1f6feb" stroke="#0b3d91" stroke-width="1.5"/>
  <text x="560" y="468" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">claude</text>
  <text x="560" y="488" text-anchor="middle" fill="#cfe0ff" font-size="13">one per agent</text>

  <!-- hooks label pill -->
  <g>
    <rect x="690" y="316" width="74" height="26" rx="13" fill="#30363d" stroke="#8b949e" stroke-width="1"/>
    <text x="727" y="334" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">hooks</text>
  </g>
</svg>
