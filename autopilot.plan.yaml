version: 1

goal: >-
  Implement the collaboration-groups, pipeline-as-substrate/monitoring, and
  cockpit-UI work described in docs/specs/2026-08-26-collaboration-groups-impl.md.
  One task = one bounded PR, gated on CI. Do not cut or push any release.

# Rules every worker must follow (the brain injects these into each spawn).
constraints:
  - Read ONLY your own stage brief in docs/specs/2026-08-26-collaboration-groups-impl.md
    plus the design doc docs/specs/2026-08-26-collaboration-groups.md. Do not load the whole plan.
  - Work in an isolated git worktree branched off the latest origin/main; one worker per task.
  - Keep the tree green — run `make verify-fast` before every commit/push. The rail has no bypass.
  - API is spec-first — edit internal/daemon/apidocs/openapi.yaml then `make generate`; never hand-edit generated code.
  - Never hand-edit reference/cli.md — run `make gendocs` after any cobra command/flag change.
  - Stay within your stage's listed file surface and honor its out-of-scope.
  - The four decisions in impl §6 are final; do not re-open them.
  - Do NOT push any v* tag or cut a release — that is a human touchpoint.
  - End each task with `wd job done --summary '<what shipped>'` once the PR is up and CI is green.

tasks:
  # ── Track B — Collaboration groups (pipeline U-B) ──
  - id: B1
    prompt: "Stage B1 (impl §3): new internal/groupstore ScrivaDB store + lean roster model."
  - id: B2
    prompt: "Stage B2 (impl §3): git-remote → project-key normalizer, with a local: fallback key for remoteless repos."
  - id: B3
    prompt: "Stage B3 (impl §3): join/leave daemon API (openapi-first); enforce one orchestrator per project (dup→409); switch caller to orchestrator role."
    after: [B1, B2]
  - id: B4
    prompt: "Stage B4 (impl §3): warden-brokered introductions on join (both directions), reusing send_message. Zero agent tokens."
    after: [B3]
  - id: B5
    prompt: "Stage B5 (impl §3): project summary resolution — declared blurb → agent-generated-once → cached."
    after: [B4]
  - id: B6
    prompt: "Stage B6 (impl §3): leave-soft vs terminate-hard semantics; confirmation/friction gate on terminating a grouped orchestrator + abandonment notices."
    after: [B3]
  - id: B7
    prompt: "Stage B7 (impl §3): recover auto-rejoin — recovered orchestrators re-join their groups and re-announce."
    after: [B3]
  - id: B8
    prompt: "Stage B8 (impl §3): `wd collaborate group <name> join|leave` CLI + `collaborate_group` MCP tool (parity) + `make gendocs`."
    after: [B4, B5, B6]

  # ── Track A — Pipeline-as-substrate & monitoring (pipeline U-A) ──
  - id: A1
    prompt: "Stage A1 (impl §4): worker done-signal — BOTH `wd job done --summary` (primary) and a <<WARDEN_DONE>>{json} sentinel (backstop). Warden captures status+summary with no extra turn."
  - id: A2
    prompt: "Stage A2 (impl §4): stuck detection — reuse the pane-state classifier (working/idle/blocked/exited) + a wall-clock watchdog that notifies on a hang."
  - id: A3
    prompt: "Stage A3 (impl §4): pipeline → owning-orchestrator link on the pipeline record (openapi-first; extend create_pipeline). Unblocks C3b and A4."
  - id: A4
    prompt: "Stage A4 (impl §4): delegated monitoring — EXTEND create_pipeline with optional callback points + owner subscription; warden wakes the owner at callbacks/completion, owner blocks on wait_for_message (no polling)."
    after: [A3]
  - id: A5
    prompt: "Stage A5 (impl §4): ambiguous-idle fallback — on the transition to idle-at-prompt, ask once for {status,details,summary}; never on a loop."
    after: [A2]

  # ── Track C — Cockpit UI ──
  - id: C1
    prompt: "Stage C1 (impl §2): TUI — hide the Approvals section when zero pending."
  - id: C2
    prompt: "Stage C2 (impl §2): TUI — render Agents and Terminals as two nested bordered frames inside the control frame."
  - id: C3a
    prompt: "Stage C3a (impl §2): TUI — conditional top-level human-Pipelines section (hide at zero) + the pipeline-node render rule (job children, (deps: …) annotated)."
  - id: C3b
    prompt: "Stage C3b (impl §2): TUI — nest delegated (owner-linked) pipelines under their orchestrator in the Agents tree; coexists with C3a's human pipelines."
    after: [C3a, A3]
  - id: C4
    prompt: "Stage C4 (impl §2): web — add an Agents fixed tab mirroring the Terminals tab (list left / AgentTab right). Leave the web Pipelines tab untouched."

# Acceptance the brain verifies before declaring the run complete.
done_when:
  - "wd check passes on the integration branch (tests, vet, verify-fast all green)."
  - "Groups: join/leave works, one-orchestrator-per-project enforced (dup→409), brokered intros delivered, leave-soft vs terminate-hard gated, recover re-joins."
  - "Monitoring: create_pipeline carries owner + callback points; both wd job done and the sentinel close a job with a summary and no interrogation turn; the stuck watchdog notifies."
  - "TUI: Approvals hidden at zero; Agents/Terminals in nested frames; human pipelines conditional top-level; delegated pipelines nested under their orchestrator with job+deps."
  - "Web: Agents tab present mirroring Terminals; the Pipelines tab is unchanged."
  - "Docs + skill updated per impl §5 DoD; make gendocs-check green. No v* tag has been pushed."
